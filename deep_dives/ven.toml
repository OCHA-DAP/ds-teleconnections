# Venezuela — El Niño, La Niña, floods and drought, 2026/27. Built by ven_deep_dive.py (builder = "ven").
# Plot-led: one plain headline per figure, a short note at most, no paragraphs. {placeholders} are filled from the
# build (it prints the values and stops when a headline's claim no longer holds), so numbers cannot drift.
iso3 = "VEN"
name = "Venezuela"
builder = "ven"
notes = [
  "<b>Rain years and phases.</b> A rain year runs from May to April: the May–November rains, then the December–April dry season. It is classed by the Sep–Nov ONI of its first year (NOAA CPC): El Niño ≥ +0.5 °C, strong El Niño ≥ +1.5 °C, La Niña ≤ −0.5 °C. Since 1981: {n_nino} El Niño years ({strong_years} strong) and {n_nina} La Niña years. “Year 1” is the year El Niño develops; “year 2” is the next one. Sep–Nov is used because Venezuela's El Niño effect starts in the developing year; by its peak ONI (+1.5 °C in Nov–Jan) 2009/10, the year of the 2010 power rationing, would count as strong.",
  "<b>Rain.</b> CHIRPS v3 (satellite and gauges) at 0.5°, averaged over each state with area weights, to {data_end}. ERA5 by state (team admin-1 statistics) to {era5_end} is used as a check: it agrees with CHIRPS on the direction of the El Niño change in {era5_agree}% of the {era5_cells} state-seasons where CHIRPS shows ±10% or more. Percentages are against the 1991–2020 normal for the same months; three-month windows with a normal under 60 mm are dry season and left out.",
  "<b>Floods.</b> FloodScan, the satellite flood-exposure record used on other pages, covers Africa only, so this page has no flood-exposure series for Venezuela. EM-DAT (CRED/UCLouvain, snapshot of {emdat_end}) lists the larger flood, wet-landslide and storm disasters since 1980; one Location field often names many states, so it is used nationally. DesInventar Venezuela (UNDRR) has {di_n} flood, rain, torrent, debris-flow, landslide and storm records by municipality; it stops in early 2016, and its reporting changes several-fold between decades, so each year is compared with the six rain years around it, and the figure shows the median over the years of each phase. CERF allocations: CERF's OneGMS feed (Venezuela only, not the regional allocations).",
  "<b>Guri.</b> NASA GSFC G-REALM satellite altimetry, every ten days since September 1992, in metres above the EGM2008 geoid. This is not the operator's gauge datum: compare falls and past lows within this record, not with published operating levels.",
  "<b>Vegetation.</b> JRC ASAP: z-score of MODIS FPAR (the share of sunlight the canopy absorbs) against the same ten days in 2001–present, averaged over cropland or rangeland in each state (GAUL admin-1), November–April.",
  "<b>Harvests.</b> FAOSTAT national yields, each year against the two years either side. From 2014 to 2019 the economic crisis drives the numbers and hides any weather signal; those years, and the years compared with them (2012–2013, 2020–2021), are left out of the correlations.",
  "<b>Forecast.</b> ECMWF SEAS5 ensemble mean by state (team admin-1 statistics; the database holds the ensemble mean only), October issuance. Three-month means are log-transformed, scaled to ERA5 and detrended, as in the team's seas5-skill app; the rank is among the 1981–2025 hindcasts for the same months, and skill is their correlation with ERA5.",
]

[catalogue]
evidence = "moderate"

[assessment]
evidence = "moderate"
one_line = "A strong El Niño means a drier October–March almost everywhere and fewer flood and landslide reports. May–August 2026 was already among the driest on record, and SEAS5 forecasts a very dry October–February."

[page]
title = "Venezuela: El Niño 2026/27"
sub = "What past El Niño and La Niña years brought, region by region: rain, floods, the Guri reservoir, vegetation and harvests. Past ranges, not forecasts, except the SEAS5 section."
dateline = "Draft · rain to {data_end} (CHIRPS) and {era5_end} (ERA5) · SEAS5 issued October {fc_year}"

[[tiles]]
big = "{now_lo}–{now_hi}%"
text = "{now_span} 2026 rain by region, as % of normal: among the six driest since 1981 in every region"
[[tiles]]
big = "−{strong_med}%"
text = "median November–March rain in the four strong El Niño years, across seven regions; none of the {strong_cells} was above normal"
[[tiles]]
big = "{di_fewer_lo}–{di_fewer_hi}% fewer"
text = "flood and landslide reports in a typical El Niño year than in an ordinary year, in every region (DesInventar, 1975–2013)"

[[sections]]
part = "Rain"
id = "maps"
fig = "maps"
head = "El Niño: less rain almost everywhere from October to March, and somewhat less in the north from June to September"
note = "The small wetter-looking patch inland on the global survey map is Apure in February–April after El Niño, a minor effect; from June to January it is normal or drier there too."

[[sections]]
id = "states"
fig = ["states", "season"]
head = "By state: the largest shortfalls come from November to March, in the north-west, the Andes, the east and Guayana"

[[sections]]
id = "now"
fig = "now"
head = "{now_span} 2026 rain was {now_lo}–{now_hi}% of normal, among the six driest since 1981 in every region"
note = "ERA5 puts {now_span} at {era5_lo}–{era5_hi}% of normal. CHIRPS, which uses gauges, leads here; ERA5 is a reanalysis that does not use gauge rain."

[[sections]]
id = "dry"
fig = "dry"
head = "November–March: in the four strong El Niño years, every region had less rain than normal, by a median of {strong_med}%"
note = "In each region, {dry_third_min}–{dry_third_max} of the {nino_n} El Niño years fell in the driest third (5 would be chance), the fewest in the {dry_third_fewest}."

[[sections]]
id = "forecast"
fig = "forecast"
head = "SEAS5, October {fc_year}: one of the driest October–February forecasts since 1981, in almost every state"
note = "{fc_driest} of {fc_cells} state-seasons from October to February rank in the driest tenth of the 45 past forecasts, once the long-term trend is removed (as in the team's seas5-skill app); before that step, it is the driest November–January forecast in {fc_raw_driest} of {fc_states} states. The forecast has skill for these months (hindcast correlation {fc_r_lo}–{fc_r_hi}). The October forecasts in 1997 and 2015 ranked about as dry; the rain that followed was among the driest on record in 1997 and below normal in 2015. February–April leans wet in the west and centre, where the forecast has little skill."

[[sections]]
part = "Floods"
id = "emdat"
fig = "emdat"
head = "El Niño years have had far fewer people affected by reported floods, landslides and storms than La Niña years: about {em_nino_yr} a year against {em_nina_yr}"
note = "Neutral years: about {em_neutral_yr}. Without Vargas 1999 and August 2021, La Niña years still had {em_ratio_ex} times the El Niño figure. El Niño years are not flood-free: June 2015 in Apure and February 2005 came in El Niño years."

[[sections]]
id = "desinventar"
fig = "desinventar"
head = "By region: {di_fewer_lo}–{di_fewer_hi}% fewer flood and landslide reports in El Niño years everywhere; more in La Niña years in {di_nina_above} of {di_regions} regions"
note = "In a typical El Niño year each region had {di_nino_lo}–{di_nino_hi} times the reports of an ordinary year. La Niña medians in the western Llanos and the centre-north: {di_llanos_nina} and {di_cn_nina}. Means are pulled up by single years (1999, 2011): {di_mean_nina} for La Niña nationally."

[[sections]]
part = "Drought: water, vegetation, harvests"
part_note = "CERF has made no drought allocation to Venezuela."
id = "guri"
fig = "guri"
head = "The Guri reservoir has fallen {guri_nino} m through the dry season after a typical El Niño year, against {guri_nina} m after La Niña"
note = "It starts this dry season near full ({guri_peak} m, against {guri_peak15} m before the 2016 low). Falls like those after past El Niño years would take it to {guri_lo}–{guri_hi} m by May {next_year}; the low end is {guri_gap10} m above the 2010 low ({guri_low10} m). How far it falls also depends on how much water is released for power, not only on rain."

[[sections]]
id = "veg"
fig = "veg"
head = "Vegetation: the three poorest dry seasons since 2000 ({veg_worst}) all followed El Niño; 2023/24 did not"
note = "The stronger the El Niño, the poorer the dry season (correlation {veg_r}), with 2023/24 the exception. Averaged over the El Niño years, cropland in November–April was below normal in {veg_states_neg} of {veg_states_n} states."

[[sections]]
id = "yields"
fig = "yields"
head = "Harvests: no clear relation with El Niño, La Niña or rain"
note = "In all three panels the points scatter without a pattern (r near 0 means no relation), and other ways of removing the trend and the crisis give the same answer (maize {maize_r_lo} to {maize_r_hi}, rice {rice_r_lo} to {rice_r_hi}). Maize fell {maize_2002}% in 2002 and {maize_2009}% in 2009, both El Niño years, but not in the strong El Niño years 1982, 1997 or 2023."
