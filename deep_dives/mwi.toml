one_line = "Graded robust from the southern-Africa row, and the grade holds — but the season is wrong. Nationally DJF is uncorrelated with ENSO (r ≈ 0); the drying is late-season (JFM r ≈ −0.34, FMA −0.45) and confined to the centre and south, while the north gets a wetter early season. Seven of ten El Niño JFM seasons were in the south's driest third."

[[sections_before]]
title = "Why the catalogue says “robust, DJF”"
html = '''
<p>The literature map was built region by region, and Malawi sits inside the southern-Africa block with Zimbabwe, Zambia, Mozambique, South Africa and Botswana. The block took the grade of the best-replicated finding in African ENSO climatology: austral-summer rainfall over the subcontinent is reduced under El Niño and enhanced under La Niña, sourced to Mason &amp; Goddard's (2001) global probabilistic composite. That finding is not in doubt; it is the basis of every regional seasonal-forecast consensus (SARCOF) since the 1990s.</p>
<p>Two things were inherited along with the grade. The season, “DJF”, was written for the whole block; for the core of the subcontinent the ENSO signal peaks in DJF–JFM, but for Malawi, at the block's northern edge, it peaks later. And the direction was written as a single national response, which for a country that spans 9.5°S to 17°S turns out to be a simplification that matters.</p>
'''

[[sections_before]]
title = "What the literature actually supports"
html = '''
<p><strong>The regional mechanism is solid, and it is a late-summer one.</strong> Warm eastern-Pacific SST shifts the Walker circulation, weakens the Angola low and the moisture flux into the subcontinent, and displaces the South Indian Convergence Zone north-eastward over the ocean; the result is subsidence and reduced rainfall over the southern African interior. Reason &amp; Jagadheesha (2005) reproduce this in models for the recent El Niños; Hoell et al. (2015) and Ratnam et al. (2014) show the response depends on El Niño flavour, strongest for canonical eastern-Pacific events. The seasonality has been known since Lindesay (1988) and Nicholson &amp; Kim (1997): the subcontinent's ENSO signal is a January–March phenomenon, weak or of the opposite sign in the early season. The catalogue's DJF is a reasonable compromise for the block but the wrong window for its northern members.</p>
<p><strong>Malawi sits on the hinge between two poles.</strong> Nicholson &amp; Kim (1997) describe the African ENSO response as a dipole: eastern equatorial Africa wetter in the short rains, southern Africa drier in late summer, with the nodal zone running through Tanzania and northern Mozambique. Northern Malawi is in that nodal zone. Nicholson, Klotter &amp; Chavula's (2014) Malawi climatology characterises the country as a transition between the East African and southern African rainfall regimes, with a stable mid-November onset, a north that is wetter and later-ending than the south, and an ENSO influence that is real but spatially uneven. ERA5's pattern — a north that responds like Kenya and a south that responds like Zimbabwe — is what this literature predicts.</p>
<p><strong>Malawi-specific evidence exists.</strong> Unlike most of the block's smaller members, Malawi has its own ENSO studies. Jury &amp; Mwafulirwa (2002) relate Malawi's summer rainfall to Pacific and Indian Ocean SST over 1950s–1990s, find dry summers associated with El Niño, and show usable predictability from the preceding season's SST; Jury &amp; Gwazantini (2002) extend this to Lake Malawi levels and Shire River flow, which integrate the late-season rains. Later station analyses (e.g. Ngongondo et al. 2011; Kumbuyo et al. 2014) confirm the ENSO link in the rainfall record. This is what earns Malawi its <em>robust</em> grade, rather than the regional composite alone.</p>
<p><strong>Operational record.</strong> The three worst food-security seasons of the past 35 years were all El Niño late seasons. 1991/92 was the worst drought in living memory across southern Africa; Malawi's maize harvest fell by well over half. In 2015/16, after a season of late onset, dry spells in the Central and Southern Regions and floods in the north, the President declared a state of national disaster on 12 April 2016 and the vulnerability assessment put 6.5 million people in need, then the largest emergency in the country's history. In 2023/24, prolonged dry spells in January and February, some longer than four weeks, led to a state of disaster in 23 of 28 districts on 23 March 2024, with about two million farming households affected; the districts named were almost all in the centre and south, plus Karonga in the north for floods. The El Niño signal in Malawi is not a curiosity of the correlation table; it is the country's disaster calendar.</p>
'''

[[sections_after]]
title = "Recommendation for the survey"
html = '''
<ul>
<li><strong>Keep the grade.</strong> Malawi's <em>robust</em> El Niño evidence is earned; if anything it is better supported by country-specific work than most of the block.</li>
<li><strong>Change the season</strong> on the catalogue row from DJF to JFM–FMA (or “late season, Jan–Apr”). The catalogue's own “This study (ERA5)” column already says FMA −0.41; the row should agree with it.</li>
<li><strong>Mark the country split</strong>, seasonally and regionally: NDJ wetter (north), JFM–FMA drier (centre and south). This is the same bidirectional treatment Ethiopia and Yemen receive, and it stops the map implying that northern Malawi shares the south's drought risk.</li>
<li><strong>Cite the Malawi studies</strong> — Jury &amp; Mwafulirwa (2002), Nicholson et al. (2014) — alongside Mason &amp; Goddard on the catalogue row.</li>
<li><strong>Add the drought framing</strong> to the “This study (ERA5)” column: in the Southern Region, seven of ten El Niño JFM seasons were in the driest third (1992, 2016, 2024 most consequentially), and the national mean hides this whenever the north is wet.</li>
<li><strong>For the seas5-skill ENSO slides and any Malawi trigger work</strong>, use JFM or FMA and a sub-national (ADM1 or pixel) view; a national DJF indicator has essentially no ENSO skill here.</li>
<li><strong>Pair the ENSO readiness signal with the FMA forecast, not JFM.</strong> SEAS5 skill for JFM is <em>low</em> at every pre-season lead in every zone; for FMA the November issuance is <em>moderate</em> in the centre and south. Treat the north separately.</li>
</ul>
'''

[[sections_after]]
title = "Caveats"
html = '''
<ul>
<li>ERA5 is a reanalysis; Malawi's gauge network is thin outside the main stations, so the rainfall field leans on the model background. The north–south gradient is consistent with the station literature, but the 2024 northern anomaly (the wettest JFM in the record by a large margin) should be checked against CHIRPS or DCCMS station data before it is quoted.</li>
<li>The country polygon includes Lake Malawi, about a fifth of the national area, so the “national” mean and the Northern and Central zones include open-water cells.</li>
<li>The zone boundaries (12.5°S and 14.5°S) are latitude proxies for the Northern, Central and Southern Regions, not the administrative lines.</li>
<li>Ten El Niño JFM seasons is a small sample; a seven-of-ten hit rate has wide uncertainty and one more event could move it by ten points.</li>
<li>The country boundary is Natural Earth 110m rasterised with “all touched”, so edge cells straddle Mozambique, Zambia and Tanzania.</li>
<li>No field-significance correction is applied at pixel level; read coherent regions, not single cells.</li>
</ul>
'''

