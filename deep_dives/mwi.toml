# Malawi — ENSO deep dive. Narrative is curated here; figures and tables are
# recomputed by enso_deep_dive.py from the cached ERA5 grid + Niño3.4.
iso3 = "MWI"
name = "Malawi"
subtitle = "Right grade, wrong window: the El Niño signal is a late-season, southern-half phenomenon that a national DJF average erases"
headline_season = "JFM"          # the season the drought analysis is built on
map_seasons = ["NDJ", "DJF", "JFM", "FMA"]   # chronological: the sign walks from blue to brown
zone_history = true
skill_seasons = ["JFM", "FMA"]
zone_history_caption = "The three zones are latitude bands (north of 12.5°S, 12.5–14.5°S, south of 14.5°S), roughly the Northern, Central and Southern Regions. Note 2024: the wettest JFM on record in the north, the sixth-driest in the south."
adm0_filtered_note = "they are listed here because the early-season (NDJ) and shoulder-season correlations carry the opposite sign and are part of the story."

summary_html = '''
<p><strong>Bottom line.</strong> The survey catalogue grades Malawi <em>robust</em> for El Niño → drier DJF rains, inheriting the southern-Africa row (Mason &amp; Goddard 2001). The grade is deserved — Malawi is one of the few countries in the block with its own ENSO literature, and ERA5 reproduces the regional signal — but the catalogue's season is wrong and its scale is wrong. Nationally, DJF rainfall is uncorrelated with Niño3.4 (r ≈ 0). The drying arrives late: JFM r ≈ −0.34 and FMA r ≈ −0.43 at country level, −0.44 in the Central Region. And it is confined to the centre and south: north of about 12.5°S Malawi behaves like East Africa, with a <em>wetter</em> early season (NDJ r ≈ +0.5) under El Niño and no late-season drying at all.</p>
<p><strong>For drought.</strong> In the south, seven of the ten El Niño JFM seasons since 1981 fell in the driest third (1983, 1987, 1992, 1995, 2010, 2016, 2024), and La Niña seasons almost never did. Nationally the count is five of ten, because the northern half offsets the south: in 2023/24 ERA5 has the Southern Region in its sixth-driest JFM of 45 years while the Northern Region had its wettest on record, and the national mean reads “wet”. 1991/92, the worst drought in the record, was an El Niño year and the driest JFM in every zone.</p>
<p><strong>Recommendation.</strong> Keep <em>robust</em>, but move the catalogue season from DJF to JFM–FMA, mark the country seasonally and regionally split (NDJ wetter in the north, JFM–FMA drier in the centre and south), cite the Malawi-specific studies, and read the survey's pixel map rather than its country map for this country.</p>
'''

seasonal_cycle_html = '''
<p>Malawi has a single rainy season from November to April: December–March carries about 79% of the annual total over the average cell, and the six months from May to October under 6%. The three-month windows the survey tests all sit inside one season, so the choice between DJF, JFM and FMA is a choice about <em>which part</em> of the season, not which season. The north (blue line) is wetter and its rains run a little later into March and April than the south's.</p>
'''

corr_html = '''
<p>Read the four panels left to right and the sign walks through the season. In NDJ the whole north is strongly positive (up to +0.5) and the south only faintly negative: El Niño's first effect on Malawi is a wet, early start in the north. In DJF, the catalogue's window, the southern and central cells have turned brown (−0.2 to −0.4) while the northern cells around Karonga, Rumphi and the Nyika plateau are still blue (+0.3 or more); the two halves cancel and the national number is near zero. In JFM the drying covers the centre and south at −0.3 to −0.5, half of all cells are past the survey's −0.3 bin, and the north has faded to neutral. In FMA even the north turns weakly brown; this is the window with the largest national correlation.</p>
<p>The survey's default pixel view (unique signal, 3-month lag) therefore shows Malawi as a brown south and a blue or blank north, and its country view shows a weaker number than the literature would lead a reader to expect.</p>
'''

adm0_html = '''
<p>The country-level pass tells the same story in one column: the sign flips from positive in NDJ to negative from JFM onward, passing through zero in DJF, the catalogue's season. The best national correlation is FMA at about −0.4, close to Mozambique's JFM value and not far from Zimbabwe's DJF, but it is reached two to three months later in the season than the catalogue implies. The partial correlations (other modes held constant) keep the sign and most of the amplitude.</p>
'''

drought_html = '''
<p>Nationally, El Niño JFM seasons average −0.3 SD and half of them fall in the driest third, against a 33% base rate; La Niña seasons average +0.3 SD and lean wet. The El Niño list is instructive. 1992 is the driest JFM in the record by a wide margin, 1987 and 1983 are in the driest fifth, 1995 and 2016 are in the driest third. Then come four seasons — 1998, 2003, 2010, 2019 — that were near normal or wet, and 2024, which the national mean puts in the wettest third.</p>
<p>The zone panels below resolve the apparent misses. 2024 was a genuine El Niño drought in the south (sixth-driest JFM of 45, with the February dry spell that led to the 23 March 2024 disaster declaration in 23 of 28 districts), masked by an exceptional wet season in the north. 2016 was dry in the centre and south and wetter than normal in the north; the 12 April 2016 national-disaster declaration cited dry spells in the Central and Southern Regions and floods in the Northern Region, exactly the ERA5 pattern. 1998 was dry in the centre, near normal in the south and wet in the north. 2010 scraped into the south's driest third and 2019 into the north's. Only 2003 was an El Niño season with no dry zone anywhere in Malawi. In the Southern Region alone, seven of ten El Niño JFM seasons were in the driest third (1983, 1987, 1992, 1995, 2010, 2016, 2024) and two in the wettest (2003, 2019); two of sixteen La Niña seasons were in the driest third.</p>
<p>The early season runs the other way. Across the fifteen El Niño NDJ seasons since 1981 the national mean was wetter than normal in seven and in the driest third in two; in the north, nine of fifteen were in the wettest third. The January 2015 floods in the Shire valley, during a weak El Niño, fit that pattern, as does the very wet January–February 2024 in the north.</p>
<p>Read as odds for the centre and south: El Niño roughly doubles the chance of a driest-third late season and makes a wet one unlikely; La Niña makes a dry late season rare. Nationally aggregated numbers understate both effects, and in a year like 2024 they hide the drought altogether.</p>
'''

skill_html = '''
<p>The ENSO signal in the centre and south is robust; whether SEAS5 can deliver it ahead of the season is a different question, and for Malawi the answer is “only just”. For JFM the forecast issued one to four months ahead has median pixel skill of 0.2–0.35 in every zone, <em>low</em> by the app's bins, with fewer than half the cells reaching moderate; the north and south touch <em>moderate</em> only at the shortest leads. Skill jumps to <em>high</em> (0.65–0.9) once one or two months of the season have been observed, which is the in-season blend, not a forecast achievement.</p>
<p>FMA, where the ENSO correlation is strongest, is also where SEAS5 does best before the season: the November issuance (3-month lead) reaches moderate skill in the centre and south with 78–90% of cells at moderate or better, and the February issuance is moderate in every zone with all central and southern cells qualifying. The practical reading for anticipatory action is that ENSO state is the readiness signal from September onward, the November SEAS5 issuance for FMA is the first forecast worth acting on for the centre and south, and the JFM forecast alone should not be a trigger at any pre-season lead. The north's weaker ENSO link and low pre-season skill argue for treating it separately, as the drought record already does.</p>
'''

zones_html = '''
<p>Splitting the country into three latitude bands, roughly the Northern, Central and Southern Regions, shows the gradient directly. The zone-mean correlation with concurrent Niño3.4 is about zero in the north, −0.4 in the centre and −0.35 in the south; the El Niño hit-rate rises from north to south.</p>
'''

