[[sections_after]]
title = "Caveats"
html = '''
<ul>
<li><strong>A relationship that switched on can switch off.</strong> The El Niño link appears only after the late 1970s in every long record for both areas. The page's numbers describe 1979–2025, not a physical law, and the coming event is likely to be stronger than any in that period.</li>
<li><strong>Small samples and index choice.</strong> 14 El Niño winters since 1979 on the pinned index (16 on HadISST), six of them strong and two of those following major eruptions. Every hit rate here carries wide uncertainty, and the break at 1979 was identified from the data and the literature together.</li>
<li><strong>The records, Gaza.</strong> No rain gauge inside Gaza reports internationally. GPCC is a 1° analysis that takes in the southern coastal plain and north-western Negev; after 2019 it is the Monitoring product, built on fewer gauges. Beer Sheva is 46 km inland, drier, and one of GPCC's inputs, so the two are not independent. ERA5 is three 25 km cells, partly over the sea, and assimilates no rain gauges. IMERG is the satellite-only late run, which tracks the gauges less well year to year. Their agreement on the sign and the timing is the evidence; no single number is Gaza's.</li>
<li><strong>The records, West Bank.</strong> GPCC's 1° cells take in the Jordan Valley and the hills on both sides. The Jerusalem gauge is one hill-town site, is one of GPCC's inputs, and its record ends in 2015. ERA5's cells are smoother and lower than the hills, so it understates heavy days and cannot see snow. A storm that soaks one hillside is diluted in any West Bank average, so the storm counts here understate local downpours.</li>
<li><strong>Forecast calibration.</strong> The September 2026 SEAS5 issuance sat in the tails of its hindcast unusually often across the globe (see the <a href="../zwe/">Zimbabwe page</a>); a very strong El Niño can do that, but the normalization check is not complete, and it has not been repeated for the October issuance. Read its return periods as a ranking. The last time El Niño and a positive Indian Ocean Dipole lined up, a “forecast of opportunity” for October–December 2023 gave better than 60% odds of above-normal rain over Southwest Asia, and the season came in at the 15th percentile (Hoell et al. 2025).</li>
<li><strong>Rainfall is one of several winter hazards.</strong> Sea surge, wind and cold caused a large share of the damage and deaths in Gaza in the last three winters, and snow and flash floods have caused much of the West Bank's; none of them has a clear El Niño signal in this analysis or in the literature (windy days may be somewhat more frequent in El Niño winters; cold nights and snow are not).</li>
<li><strong>Impact figures.</strong> Counts from the Ministry of Health in Gaza, the Palestinian Civil Defense and the Government Media Office are relayed, not verified, by the UN; OCHA does not systematically monitor deaths that are not caused by the hostilities. Most West Bank weather impacts are reported by the Palestinian Civil Defense through the media, often as counts of incidents or rescues, and the UN quantified one West Bank weather event in three winters. Reporting practice changed between winters, several figures are cumulative or count exposure rather than impact, and the absence of counts is not an absence of impact.</li>
</ul>
'''
