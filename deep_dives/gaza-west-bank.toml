name = "Gaza and the West Bank"
builder = "levant-combined"
parts = ["gaza", "west-bank"]
map_outline = ["PS01", "PS02"]                 # COD-AB admin 1: West Bank, Gaza
redirect_from = ["gaza", "west-bank"]          # the former standalone pages
eyebrow = "ENSO deep dive · Occupied Palestinian Territory"
subtitle = "What the 2026 El Niño means for the 2026/27 winter in Gaza and the West Bank, including East Jerusalem, how far to trust it, and what winter weather does there"

summary_html = '''
<p><strong>1. What the forecasts say.</strong> A very strong El Niño is under way. NOAA gives El Niño 100 per cent odds through January–March and a 75 per cent chance that October–December will be the strongest since 1950, weakening through the winter. Every multi-model forecast checked (C3S, ECMWF SEAS5, NMME, IRI, the WMO Lead Centre) favours above-normal rain over the southern Levant in October–December (40–70 per cent for the wet tercile), with weaker odds in November–January and no wet signal for December–February, where one system (NMME) leans dry. All favour a warmer-than-normal winter. ECMWF's October forecast (SEAS5, published on 5 October) keeps the wet start: October–December is at about a 9-year wet return period over both Gaza and the West Bank, with high skill. The later windows are only slightly wet, with moderate skill for November–January and December–February and low skill after.</p>
<p><strong>2. How much El Niño matters.</strong> Since 1979, clearly, and the same in both places. Gauge-based records and ERA5 correlate at +0.55 to +0.67 with winter Niño3.4 over Gaza and +0.57 to +0.59 over the West Bank, and 9 of the 14 El Niño winters fell in each area's wettest third. That moves the chance of a wettest-third winter from about one in three to about two in three, with a wide range on 14 cases. But the same records show no positive link before 1979, and the strong El Niños, the relevant analogues for this year, have been mixed: in Gaza three of six were wet, one normal and two normal to dry; in the West Bank none was in the driest third in GPCC or at Jerusalem, though other records put single winters there. The two wettest, 1982/83 and 1991/92, both followed major volcanic eruptions. El Niño shifts the odds towards a wet winter, mostly in its first half; it does not forecast one.</p>
<p><strong>3. What changes in an El Niño winter.</strong> Mostly the number of rain days: about ten more per winter than in a La Niña winter in Gaza, and 10 to 14 more in the West Bank, and, in most records, more days of 10 mm or more. The biggest single storms are only loosely tied to El Niño, and cold nights not at all.</p>
<p><strong>4. What winter weather does.</strong> In Gaza, every winter since October 2023 has flooded tents, including the very dry 2024/25. Damage followed ordinary rain, high tides with almost no rain, wind and cold nights. Last winter the Shelter Cluster counted more than 42,000 tents damaged in Storm Byron alone, 71 per cent of households were flooded at least once, and at least 11 children died of hypothermia (Ministry of Health in Gaza). In the West Bank, weather does far less harm and is poorly counted. The worst winters before October 2023 brought floods (January 2013) and snow (Storm Alexa, December 2013); since October 2023 the UN has quantified one West Bank weather event, when at least 66 households in 18 herding communities lost tents and animal shelters or had them damaged on 28–30 December 2025.</p>
<p><strong>5. What this winter could bring.</strong> In Gaza, about half of winters bring a storm with a day of 50 mm or more, as Byron had, El Niño or not. Last winter's alert-based counts total about 80,000–100,000 household-impacts, about 58,500 tents and shelters damaged and 35–36 deaths reported, and they understate it: a household survey suggests about 250,000 households were flooded at least once. Exposure is higher this winter: 451 sites holding about 464,000 people are rated high flood risk. Storm for storm, the counts of people affected are tens to hundreds of times higher than before October 2023, a ratio that mixes the change in how people are sheltered with closer counting. Scaled to the 1.7 million people now in displacement sites, last winter's counts imply about 140,000–230,000 people-impacts in a winter with no storm of 50 mm or more, 400,000–530,000 with one and 670,000–800,000 with two. These are planning scenarios built on one winter, and alert-based counts are floors. In the West Bank, a wet first half is the most likely El Niño outcome (a storm of 20 mm or more came before December in 7 of 8 El Niño winters), and the most exposed are Bedouin and herding communities in Area C, about 34,000 people still displaced from the Jenin, Tulkarm and Nur Shams camps, and farmers whose greenhouses take the wind, frost and flood damage. In both places the wettest week of a typical winter brings a fifth to a quarter of the year's rain; Byron's week brought about half. None of this is a forecast.</p>
<p><strong>6. Farming in the West Bank.</strong> The three farming zones cannot be told apart in their El Niño rain signal; they differ in what they grow. Rainfed wheat and barley were above trend in 7 of 9 crop years after El Niño winters and 3 of 11 after La Niña winters, and the four worst harvests since 1994 all followed La Niña winters: El Niño has made a bad cereal year less likely rather than a bumper one more likely. Spring greenness after El Niño winters was above normal in 8 of 8 years in the Central Highlands (several only slightly) and 6 of 8 in the other zones. Olives follow their own two-year bearing cycle and, since 2023, access, and show no clear El Niño signal. This winter feeds the 2027 cereal harvest, spring grazing and the autumn 2027 olive harvest.</p>
'''

before_html = '''
<p class="small"><strong>About the catalogue row.</strong> The survey's “Palestine” row was computed on the Natural Earth polygon for the West Bank only, so it describes the West Bank (its ERA5 value was OND +0.56) and has never described Gaza. Its second citation is garbled: the paper is Price, Stone, Huppert, Rajagopalan &amp; Alpert (1998) in <em>Geophysical Research Letters</em>, not a <em>Journal of Climate</em> paper. And Mariotti et al. (2002) found the El Niño autumn wet signal in the <em>western</em> Mediterranean, with negative anomalies in the east in their reanalysis. The grades here rest on this page's records and on the Israel-specific literature.</p>
'''

forecast_html = '''
<p>NOAA's September outlook gives El Niño 100% odds for every season through January–March 2027. It has the event peaking in October–December, with a median relative Niño3.4 index of +2.67 °C and a 75% chance of exceeding +2.5 °C, which no event since 1950 has done. It then weakens to about +1.8 °C by January–March. On that same relative index, the October–December and November–January medians are above every El Niño since 1950. All 22 models in the IRI plume stay “very strong” through December–February, and IRI's traditional Niño3.4 (on a different sea-surface temperature dataset) was +2.52 °C in August and about +3.0 °C in mid-September; the highest month in the series this page uses is +2.72 °C (November 2015). A positive Indian Ocean Dipole is developing and is expected to fade by early 2027. The coming winter is likely to be a stronger El Niño than any the relationships below were fitted on.</p>
<p>The rainfall forecasts agree on a shape, not only a sign: wet odds for October–December, weaker for November–January, and no wet signal for December–February, where NMME leans dry (40–60%). That is the part of the season the El Niño signal has historically favoured (section 2), and the part where SEAS5 has skill. The forecasts also agree the winter will be warm. A warm winter makes snow on the West Bank hills less likely, but it still has cold nights: in Gaza, the newborn hypothermia deaths of December 2024 happened on nights of about 9 °C. SEAS5 and the C3S multi-model mean lean towards a negative North Atlantic Oscillation in late winter. Most Levant studies find that pattern is not a wet one for Israel and the Occupied Palestinian Territory (Nissen et al. 2010; Sandler et al. 2024), and the forecast pressure anomaly over the Levant is near zero.</p>
<p>ECMWF's October forecast (SEAS5, published on 5 October) is the first of the October issuances. It keeps the wet start: October–December is at about a 9-year wet return period over both Gaza and the West Bank, with high skill. Like for like, that is a little wetter than a month ago for Gaza (about 7 years) and less extreme for the West Bank (23 years). The rest of the winter, slightly dry or near normal in the September issuance, is now slightly wet, and February–April is wetter again; skill is moderate for November–January and December–February and low after. The other centres' October forecasts are not yet out, so the table below is still the September one, including its ECMWF row.</p>
'''

forecast_table_note = '''
<p class="small">Tercile probabilities for the wet (AN) or dry (BN) category over the southern Levant, read from the legend classes of each centre's published maps. Gaza is smaller than every model's grid cell and the West Bank's hill country is not much larger, so these are southern-Levant values for both. “No signal” means no category above 40%. Compiled 30 September 2026. The October issuances (NOAA on 8 October, C3S around 10–13 October) will extend the horizon to January–March, and the Mediterranean Climate Outlook Forum (MedCOF) normally issues its winter consensus in late November.</p>
'''

maps_html = '''
<p>The signal is not an artefact of either area. Across the southern Levant (the Israeli coastal plain, the hills of the West Bank, western Jordan and southern Lebanon), cells show the same positive correlation. It is most coherent in October–December (97% of analysable cells at r ≥ 0.3, though only 71 cells are analysable; the rest are too dry in that window) and November–January (76% of 144), and patchier in December–February and January–March. As in the survey, each cell keeps the best of four lags (0–3 months), which flatters r somewhat; the composite maps use concurrent December–February Niño3.4 and no lag search. Over the 14 El Niño winters of 1981/82–2025/26, every analysed cell in the region had a positive mean anomaly.</p>
'''

# Six key messages for the coming winter, shown in a box above the verdict cards. Findings, not recommendations.
key_messages_title = "Key messages for winter 2026/27"
key_messages_dateline = "As of the September 2026 multi-model forecasts (compiled 30 September), ECMWF's October forecast (published 5 October) and exposure data to 25 September 2026. To be updated after the other October forecasts (NOAA on 8 October, C3S around 10–13 October) and the MedCOF winter consensus in late November."
key_messages_footer = "El Niño's link to winter rain here has held only since 1979, and this event is likely to be stronger than any it was measured on. Impact counts understate. None of this is a forecast."

[[key_messages]]
lead = "The odds favour a wet start to the winter; they do not forecast a wet winter, or a flood."
text = "With a very strong El Niño under way, the September forecasts gave a 40–70 per cent chance that October–December falls in its wettest third over the area, against one in three normally. ECMWF's October forecast keeps the wet start: its October–December ranks among the wettest fifth of its past forecasts for both areas. For December–February, when most of the rain falls, there is no clear wet signal: one September model leaned dry, and ECMWF's October forecast is only slightly above normal. Since 1979, 9 of 14 El Niño winters were in each area's wettest third; the last strong one, 2023/24, was normal to dry in Gaza."

[[key_messages]]
lead = "El Niño adds rainy days, not bigger storms, and says little about cold, wind or the sea."
text = "El Niño winters bring about ten more rain days than La Niña winters (10 to 14 in the West Bank), while the season's biggest storm is only loosely tied to it. A day of 50 mm or more, as in Storm Byron last December, comes in about half of Gaza's winters, El Niño or not. A large share of Gaza's recent damage and deaths came with high tides, wind and cold, not rain."

[[key_messages]]
lead = "In Gaza, damage has started by mid-to-late November in each winter since October 2023, and ordinary rain is enough to cause it."
text = "First damage was reported on 13–14 November 2023, 24–25 November 2024 and 14–15 November 2025, twice before the winter's first storm of 20 mm. Tents have flooded on days of 16 mm or less, and after high tides with almost no rain. Last winter's first storm, 22 mm on 14–15 November, damaged an estimated 13,000 tents."

[[key_messages]]
lead = "Last winter's Gaza counts are a floor, and exposure is higher this winter."
text = "Alerts counted about 80,000–100,000 household-impacts (one per household per storm), about 58,500 tents and shelters damaged and 35–36 deaths reported; a June survey found 71 per cent of households flooded at least once, about 250,000. About 1.7 million people live in some 1,600 sites, 65 per cent of households in tents or makeshift shelters, more than half of those tents in poor condition; 451 sites with about 464,000 people are rated at high flood risk."

[[key_messages]]
lead = "In the West Bank the harm is far smaller and barely counted; it falls on Bedouin and herding communities in Area C, people displaced from the northern West Bank refugee camps and greenhouse farmers."
text = "Since 2023 the UN has quantified one weather event: at least 66 households in herding communities had tents and animal shelters damaged in late December 2025. About 34,000 people remain displaced from the Jenin, Tulkarm and Nur Shams camps, over 80 per cent of them renting, which points to heating and housing more than floods as their winter risk. In 7 of 8 El Niño winters the first storm of 20 mm came before December."

[[key_messages]]
lead = "For West Bank rainfed crops and pasture, a wet winter would lower the odds of a bad 2027; this autumn's olive crop is already set."
text = "Wheat and barley were above trend after 7 of 9 El Niño winters and 3 of 11 La Niña winters, and the four worst harvests since 1994 all followed La Niña. That is an avoided bad year, not a bumper one, on small samples. Olives follow their two-year cycle and access to the groves more than the rain."

