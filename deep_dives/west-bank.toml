[assessment]
direction = "wetter, Oct–Apr"
season = "strongest Oct–Dec"
evidence = "moderate"
evidence_note = "Gauge records and ERA5 agree since 1979 (r = +0.57 to +0.59); no positive link before 1979; strong El Niños since 1979 were normal to wet in GPCC."
one_line = "2026/27 outlook: a very strong El Niño and a SEAS5 forecast for a wet October–December (23-year return period, high skill). Since 1979, 9 of 14 El Niño winters were in the West Bank's wettest third and none in the driest, but the link did not exist before the late 1970s. Weather impacts are small and poorly counted; herding communities in Area C and people displaced from the northern camps are the most exposed."

[titles]
forecast = "1. What the forecasts say for this winter"
skill = "SEAS5 for the West Bank: skill and the September 2026 forecast"
enso = "2. How much El Niño matters for a West Bank winter"
daily = "3. What changes in an El Niño winter, and what does not"
impacts = "4. What winter weather does in the West Bank"
range = "5. What this winter could bring"

[[sections_after]]
title = "Caveats"
html = '''
<ul>
<li><strong>A relationship that switched on can switch off.</strong> The El Niño link appears only after the late 1970s in every long record, and the coming event is likely to be stronger than any in that period.</li>
<li><strong>Small samples and index choice.</strong> There are 14 El Niño winters since 1979 on the pinned index (16 on HadISST), six of them strong. Every hit rate carries wide uncertainty.</li>
<li><strong>The records.</strong> GPCC's 1° cells take in the Jordan Valley and the hills on both sides. The Jerusalem gauge is one hill-town site, is one of GPCC's inputs, and its record ends in 2015. ERA5's cells are smoother and lower than the hills, so it understates heavy days and cannot see snow. IMERG is satellite-only. A storm that soaks one hillside is diluted in any West Bank average, so the storm counts here understate local downpours.</li>
<li><strong>Forecast calibration.</strong> The September 2026 SEAS5 issuance sits in the tails of its hindcast unusually often across the globe (see the <a href="../zwe/">Zimbabwe page</a>). Read its return periods as a ranking.</li>
<li><strong>Impact data.</strong> Most West Bank weather impacts are reported by the Palestinian Civil Defence through the media, often as counts of incidents or rescues, and the UN quantified one weather event in three winters. The absence of counts is not an absence of impact.</li>
</ul>
'''

