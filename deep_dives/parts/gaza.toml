# One part of deep_dives/gaza-west-bank.toml (the combined page supplies the summary, forecast text and table,
# regional-maps text, caveats, catalogue row and index card). This file: the area config and its section narratives.
# Gaza — ENSO deep dive. Built by levant_deep_dive.py (builder = "levant"), not the generic
# analyse(): Gaza is three ERA5 cells and its winter hazard is rain, wind, sea and cold, not drought.
# Figures and tables are recomputed on every run; the narrative here must be reconciled against
# them after every rebuild. Impacts are curated from public UN/cluster reporting only.
iso3 = "PSE"
name = "Gaza"
builder = "levant"
skill_issued_month = 9
skill_intro = false
timeline_winters = [2023, 2024, 2025]

skill_html = '''
<p>The September 2026 SEAS5 issuance forecasts a wet start to the season over Gaza and little after it. September–November is at a 9-year wet return period, October–December 7 years and November–January 3.5 years; December–February and January–March are slightly dry of their hindcast medians (2- to 3-year dry return periods). Skill from September is moderate for the first three windows (r = 0.44–0.49) and low or absent for the last two (0.29 and 0.0). The raw ensemble-mean files for a box over Gaza give the same picture independently of the app's cube (table below): the September–November forecast is the 5th-wettest of 46 September issuances since 1981 and October–December the 8th. SEAS5's three wettest September–November hindcasts are 1997, 1982 and 2015, the three strongest El Niños in its record. So this is the El Niño signal the model carries, not an independent source of information.</p>
'''

monthly_html = '''
<p>By month, the wet signal sits in October (+79% on the hindcast mean, the 4th-wettest of 46 September forecasts) and November (+22%, the 8th). December, January and March are at their hindcast means, and February is slightly dry (−11%). Skill for single months is low throughout the rainy season (r = −0.01 to +0.27), so read the monthly split as a guide to where the three-month signal sits, not as a forecast for individual months.</p>
'''

enso_intro_html = '''
<p>Gaza's rain falls between October and April, most of it from December to February, almost all of it from Mediterranean cyclones. Gaza is 365 km²: three ERA5 cells and a corner of one GPCC cell. So this section uses four rainfall records: two gauge-based (the GPCC analysis, and the Beer Sheva gauge, which is one of GPCC's inputs), a reanalysis that assimilates no rain gauges (ERA5), and a satellite product (IMERG). It asks two questions: does El Niño make Gaza's winter wetter, and has it always done so?</p>
'''

stationarity_html = '''
<p>Since the late 1970s, yes; before that, no. Since 1979 the correlation between the October–April total and December–February Niño3.4 is +0.55 in GPCC (to 2024/25), +0.59 in ERA5 (to 2025/26) and +0.67 at the Beer Sheva gauge (to 2015/16). Each is significant at p &lt; 0.001 and unchanged by detrending, and each holds at +0.45 to +0.62 without 1982/83 and 1991/92. Before 1979 the same records give −0.06 (GPCC, from 1891), −0.26 (Beer Sheva, from 1921; nominally significant, p = 0.045) and −0.26 (ERA5, from 1950). Over each full record the correlation is weak (+0.13 to +0.29). All three running correlations climb out of the noise band in the early 1980s and stay out. The switch is in the gauge records as well as the reanalysis, so it is not an artefact of ERA5.</p>
<p>The literature found the same break. Price et al. (1998) saw significant correlations only in the last 25 years of their Israeli record, and Alpert et al. (2005) found no connection before the 1970s. A 2026 Israel Meteorological Service technical report (not peer-reviewed) finds r ≈ 0.50–0.55 over the last 50 years, strongest in the northern Negev and the Shephelah next to Gaza, and about 11–14% more rain per degree of Niño3.4. Similar switches have been found for Arabian winter rainfall (Kang et al. 2015) and Euro-Mediterranean winter storm frequency (Kamil et al. 2017: −0.24 in 1950–79, +0.44 in 1987–2016). Reviews call the eastern Mediterranean ENSO influence “seasonally dependent, small, and intermittent” (Dayan et al. 2015).</p>
<p>What this means for use: the relationship has held for 45 winters, the whole period in which seasonal forecasts have existed. But it is not a law of nature, and it could weaken again. IMERG (1998–) agrees on the sign but is weaker (r = +0.31, not significant over 28 winters). Its seasonal totals track the gauges less well (r = 0.72 with GPCC) than ERA5 does (0.91).</p>
'''

history_html = '''
<p>Since 1979, 9 of the 14 El Niño winters in the GPCC record fell in the wettest third and 2 in the driest; in ERA5, 9 and none. La Niña winters ran the other way: 2 of 19 in the wettest third and 10 in the driest. Before 1979, El Niño winters were as likely to be dry as wet (8 in the wettest third and 11 in the driest, of 25), and La Niña winters were if anything wet (11 of 26 in the wettest third, 5 in the driest).</p>
'''

strong_html = '''
<p>Strength does not buy certainty, and the literature agrees that larger El Niños do not reliably bring larger rainfall anomalies here (Mariotti et al. 2002; Alpert et al. 2005). Of the six strong El Niños since 1979:</p>
<ul>
<li>three were wet: 1982/83 and 1991/92, the two wettest winters since 1979, and 2015/16;</li>
<li>one was normal (1997/98);</li>
<li>two were normal to dry, depending on the record: 2009/10, and 2023/24, the first winter after October 2023.</li>
</ul>
<p>1982/83 and 1991/92 both followed major volcanic eruptions (El Chichón, Pinatubo), and 1991/92 was unusually cold across the Middle East. That makes them doubtful analogues for a winter every forecast expects to be warm. It is a caution about analogues, not a reason to discount them: we found no study attributing their rainfall to the eruptions. The two strong events before 1979 (1957/58, 1972/73) were normal to dry. The El Niño winters that delivered most reliably were moderate ones (1986/87, 1987/88, 1994/95, 2002/03).</p>
'''

trimester_html = '''
<p>The concurrent signal runs through the whole season, strongest early: r = 0.35–0.52 for every three-month window from October–December to January–March, in both GPCC and ERA5. What matters for a forecast now is the August–October Niño3.4, known before the season starts. It predicts the season total nearly as well (r = 0.45 in GPCC, 0.50 in ERA5), the windows from October–December to December–February at 0.32–0.46, and January–March more weakly (0.28–0.29, borderline significant). That matches SEAS5, whose skill and wet signal both fade after December, and the literature, which puts the eastern Mediterranean ENSO signal in autumn and early winter (Hochman &amp; Gildor 2025; Mariotti et al. 2005).</p>
'''

daily_html = '''
<p>A wetter El Niño winter is mostly a winter with more rainy days, not bigger storms. In all three records the number of rain days rises with Niño3.4 (r = 0.55–0.65). ERA5 has 54 rain days in an average El Niño winter against 42 in a La Niña winter, IMERG 41 against 33, and the Beer Sheva gauge 33 against 22. Days of 10 mm or more rise clearly at Beer Sheva (7.8 against 4.4) and in ERA5, but not in IMERG. The heaviest days are only loosely tied: for days of 20 mm or more and for the season's wettest day, correlations are 0.16–0.34, and only ERA5's wettest day clears p &lt; 0.05. The Israel Meteorological Service likewise finds no significant El Niño link to daily or storm maximum rainfall, but about 15% more days with a nearby low in El Niño than in La Niña winters. Cold nights show no link (Beer Sheva, r = +0.08). Windy days may be somewhat more frequent (12.8 against 9.3 of ERA5's top-5% days, r = +0.34, p = 0.02); with 17 tests in the table, treat that as suggestive.</p>
<p>The distinction matters for people in tents. The storms that tear down shelters and flood whole sites, like Byron in December 2025, can come in any winter. What El Niño adds is more wet days around them. Our reading, not tested here, is that this is what keeps ground saturated, stormwater basins full and bedding wet between storms.</p>
'''

impacts_intro_html = '''
<p>As of September 2026 about 1.7 million people live in roughly 1,600 displacement sites, and 65% of households live in tents or makeshift shelters. Last winter 71% of households were flooded at least once, and 83% of those in tents (Shelter Cluster). The inter-agency flood-exposure outlook for 2026/27 puts 989 of 1,764 assessed sites in medium- or high-risk areas, and 451 sites holding about 464,000 people in high-risk areas (IOM, Site Management Cluster and Shelter Cluster, September 2026; OCHA). That exposure map uses terrain and past flooding, not rainfall. No published analysis links rainfall amounts to tent flooding in Gaza, and no rain gauge inside Gaza reports internationally. The table below is a first pass at that link: every dated winter impact in UN reporting since October 2023, with the weather over Gaza on those days.</p>
<p>Three things stand out.</p>
<ul>
<li><strong>The rain that floods tents is ordinary.</strong> In 2023/24, tent flooding was reported on days when neither product had more than about 16 mm over Gaza. On 31 December 2024, in an otherwise very dry winter, IMERG had 34 mm (ERA5 9 mm). In 2025/26 the rain-driven events ranged from about 13 to 66 mm on their wettest day in IMERG. For comparison, IMERG averages 9 days of 10 mm or more and 3.3 of 20 mm or more over Gaza every winter. Byron (rain from 8 December, the storm proper from 10 December; about 150 mm in IMERG) was large, but the pre-October 2023 benchmark, Storm Alexa in December 2013, was larger (about 185 mm over 11–14 December in IMERG).</li>
<li><strong>Several damaging events came with little or no rain.</strong> These were the coastal flooding of 24–25 November 2024 (about 3 mm; high tides), the wind storms of 5–6 February 2025 and 14 March 2026, and the cold spells in which newborns died of hypothermia (ERA5 minimum 9 °C on 24–29 December 2024, 4 °C on 24–25 February 2025). A seasonal rainfall forecast says nothing about these.</li>
<li><strong>Reporting changed between winters</strong>, from descriptive in 2023/24 to authority counts in 2024/25 and daily cluster alerts in 2025/26. So impact counts cannot be compared across winters; the dates can.</li>
</ul>
'''

prewar_html = '''
<p>Before October 2023, winter floods hit homes, refugee camps and the low ground around Wadi Gaza and the Sheikh Radwan stormwater lagoon, mostly because drainage was overwhelmed or pumping stations had no power. Even then the threshold was low. “Mild rainfall” (about 3 mm in IMERG) flooded houses and a sewage pump station in Gaza city in November 2017, and four children died of cold in the January 2015 storm, all from families whose homes had been destroyed in the 2014 hostilities.</p>
'''

strong_notes = { "1982" = "El Chichón erupted in April 1982; 1982/83 is in Dogar et al.'s (2017) composite of volcanically cooled Middle East winters.", "1991" = "Pinatubo erupted in June 1991; snow in Jerusalem and the Negev; about twice the average rainfall in Israel (IMS).", "2009" = "IMS: southern coastal plain 50–75% of normal.", "2015" = "IMS: Be'eri, next to Gaza, 153% of normal; nationally a dry year.", "2023" = "IMS: 70–90% of normal in the areas of Israel next to Gaza while northern Israel had 130–165%; about 2 °C warmer than average." }

range_intro_html = '''
<p>The question for planners is what this winter could do. The record cannot answer that with a forecast: there is one well-documented winter, reporting that changed every year, and a population whose exposure keeps changing. What it can do is bound the answer. This section separates the weather (how many storms, how big, how early, and what El Niño does or does not change) from what each kind of storm did last winter, and then uses last winter as two reference points.</p>
'''

week_html = "IMERG and the Beer Sheva gauge differ in their totals but agree closely on the share; Beer Sheva is 46 km inland and drier than Gaza, so compare its shares, not its millimetres. Byron's week came close to half an average year."
first_storm_html = '''
<p>This is where El Niño may matter, though not by much more than chance on eight winters. In 5 of the 8 El Niño winters of the IMERG record, the first storm of 20 mm or more came before 1 December, against 12 of 28 winters overall, and the September forecasts put this year's wet anomaly in October and November. Damage does not wait for a big storm, though. In each of the last three winters the first weather damage was reported in mid to late November (13–14 November 2023, 24–25 November 2024, 14–15 November 2025), and in two of them that came before the winter's first 20 mm storm. Last winter's first storm, with 22 mm, damaged about 13,000 tents.</p>
'''

storm_kinds_intro_html = '''
<p>Each row is one real event, mostly from 2025/26, with how its numbers were counted. None is an average: every row is a single case, and counts made at the sites assessed are floors.</p>
'''

reference_intro_html = '''
<p>Last winter's observed totals, split into Byron and everything else. About half of winters bring a storm with a day of 50 mm or more, as Byron had; that held across IMERG's 28 winters, and El Niño did not change it. So the split shows what last winter's counts looked like with and without the one storm that dominated them.</p>
<p>All of these numbers understate last winter. They come from alerts raised by the sites that were reached. In June 2026 the Shelter Cluster's household survey found 71% of households had been flooded at least once; applied to the roughly 355,000 households in displacement sites, that is about 250,000 households. So the alert-based totals probably caught a third or less of the households flooded. Exposure is also higher this winter. About 1.7 million people live in roughly 1,600 sites, against about 1.5 million in about 940 sites last December (counted differently). 65% of households are in tents or makeshift shelters, and more than half of those tents are in poor or very poor condition after a year's use. Last winter was a weak La Niña, not an El Niño. None of this is a forecast.</p>
'''

range_after_html = '''
<h3>Exposure then and now</h3>
<table><thead><tr><th></th><th>Early winter 2025/26</th><th>September 2026</th></tr></thead><tbody>
<tr><td>People in displacement sites</td><td>about 1.5 million in 942 sites (early December 2025)</td><td>about 1.7 million in 1,591 verified sites</td></tr>
<tr><td>Sites and people in flood-prone areas</td><td>761 sites, about 795,000 people (pre-winter mapping)</td><td>989 of 1,764 sites at medium or high risk; 451 sites with about 464,000 people at high risk</td></tr>
<tr><td>Households in tents or makeshift shelters</td><td>—</td><td>65%; 54% of tents in poor or very poor condition</td></tr>
<tr><td>Shelter and site-management funding (2026 Flash Appeal)</td><td>—</td><td>Shelter 26%, Site Management 2% (18 September)</td></tr>
</tbody></table>
<p class="small">Site Management Cluster, Shelter Cluster and IOM figures via OCHA (SitRep 40, December 2025; HSU #353, January 2026; Humanitarian Situation Report, 25 September 2026); Shelter Cluster household survey, June 2026. The 2025 and 2026 site counts use different methods.</p>
<h3>Deaths</h3>
<table><thead><tr><th>Winter</th><th>Cold and hypothermia</th><th>Building collapse</th><th>Source</th></tr></thead><tbody>
<tr><td>2023/24</td><td>none reported by the UN</td><td>none reported</td><td>reporting on weather deaths was almost absent</td></tr>
<tr><td>2024/25</td><td><em>at least 8 by 6 January; 6 newborns on 24–25 February</em></td><td>none reported</td><td><em>Ministry of Health; health officials quoted in media</em>, both via OCHA</td></tr>
<tr><td>2025/26</td><td><em>11 children (by 27 January)</em></td><td><em>25 (mid-December to 14 January)</em></td><td><em>Ministry of Health</em> via OCHA (its storm-related total was 31 by 14 January: 24 collapse and 7 cold); Byron's 12 storm deaths (11 collapse, 1 cold) were confirmed by the Health Cluster</td></tr>
</tbody></table>
<p>No range is given for deaths. Cold deaths followed shelter more than temperature: last winter had only 2 nights at or below 8 °C in ERA5 over Gaza and 11 child deaths; the winter before had 8 such nights. Collapse deaths came with Byron, when rain soaked buildings already damaged in the hostilities. Almost every death count comes from the authorities in Gaza, and OCHA does not systematically monitor deaths unrelated to the hostilities.</p>
'''

