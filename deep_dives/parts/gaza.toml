end = "2019-12-09"
hazard = "R"
what_html = 'About 2,000 homes flooded (initial reports).'
source_html = '<a href="https://www.ochaopt.org/sites/default/files/hummonitor_nov_2019.pdf">OCHA Humanitarian Bulletin</a>, Dec 2019'
