# Winter-by-winter record, the before/since comparison and the scenarios (section 5, last three subsections)
[winter_impacts]
hh_size_before = 5.6           # people per household, Gaza Strip, PCBS census 2017
hh_size_since = 4.8            # Site Management Cluster counts 2025/26; 1.7 million people in about 355,000 households
people_in_sites_then = 1.5e6   # early December 2025 (942 sites)
people_in_sites_now = 1.7e6    # September 2026 (1,591 verified sites)
survey_flooded_share = 0.71    # Shelter Cluster household survey, June 2026
before_label = "Before October 2023: people in houses; counts of people evacuated, displaced or whose homes were damaged"
since_label = "Since October 2023: most people in tents and makeshift shelters; counts from partner assessments and site alerts"
table_intro_html = '''
<p>Every winter since 2008/09 on one row. The impact columns are not one series: before October 2023 they count people evacuated, displaced or with damaged homes, in the few storms that OCHA, UNRWA or UNICEF quantified; since, people whose tents and shelters flooded or were damaged. They are set side by side for scale only.</p>
'''
storm_for_storm_html = '''
<p>How much more does the same weather do now? The record supports a comparison by size of storm, not a rate per millimetre: two counted winters cannot fix a slope, and events with almost no rain were counted in the thousands.</p>
'''
multiplier_caveat_html = '''
<p><strong>What the multiplier mixes.</strong> It is a ratio of reported counts, and three changes are folded into it: how people are sheltered (tents and damaged buildings, many on flood-prone ground, where before they had houses), which is the real change in vulnerability; what is counted (people evacuated or with damaged homes then, people whose tents flooded now); and how closely (occasional situation reports then, daily site alerts last winter). The record cannot separate them, which is why section 4 warns that counts cannot be compared across winters like for like. Read “tens to hundreds of times” as the scale of the change, not a measurement of it.</p>
'''
scenario_intro_html = '''
<p><strong>These are planning scenarios, not a forecast.</strong> Two counted winters cannot support a fitted model. The cases take what last winter's weather did, as it was counted, and scale it to this September's number of people in displacement sites: hazard, times what that hazard did last winter, times exposure now against then. They differ by what dominated last winter's counts, a storm with a day of 50 mm or more, which El Niño has not made more likely and no forecast sees more than days ahead.</p>
'''
corr_note_html = "That rests on two floods, Wadi Gaza in January 2010 and Storm Alexa in December 2013, and what El Niño adds is rain days, not bigger storms (section 3)."
top_storms_html = "Byron (about {since_rain} mm in IMERG; at least {since_people} people) had {ratio} times the count of Storm Alexa (about {before_rain} mm; homes of {before_people} people damaged, about 10,000 evacuated), with less rain."
tier_note = "The one count of 10–20 mm before October 2023 is from January 2020; its date is approximate and its wettest day, at 20 mm, sits on the boundary."
survey_note = " (June 2026; households in all types of shelter in accessible areas; 83% of those in tents)"
scenario_limits_html = '''
<li><strong>The scaling is crude.</strong> It assumes impact rises in step with the number of people in sites. Older tents (54% in poor or very poor condition) would raise it; site preparation, drainage and relocation would lower it. Neither is in the figures.</li>
'''

[winter_impacts.deaths]
"2023" = '<span class="small">not reported</span>'
"2024" = "<em>at least 14</em>"

