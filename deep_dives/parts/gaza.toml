end = "2015-01-13"
hazard = "C R"
what_html = 'Storm Huda: four children died of cold on 9, 10, 11 and 13 January, all from families whose homes were destroyed in the 2014 hostilities; 151 people in UNRWA centres.'
source_html = '<a href="https://unispal.un.org/pdfs/UNICEFSitRpt_150115.pdf">UNICEF SitRep</a>, Jan 2015'
[[prewar]]
start = "2017-11-26"
hazard = "R"
what_html = '“Mild rainfall” flooded houses, shops and the al-Nafaq sewage pump station in Gaza city (no grid power for the pumps).'
source_html = '<a href="https://www.ochaopt.org/content/poor-infrastructure-and-lack-funding-put-over-560000-people-risk-flooding-gaza-strip">OCHA</a>, Dec 2017'
[[prewar]]
