source_html = '<a href="https://unispal.un.org/pdfs/AA6D4FA03A98636185257C43006590A4.pdf">OCHA SitRep</a>, 14 Dec 2013; <a href="https://www.un.org/unispal/document/auto-insert-202086/">16 Dec</a>'
[[prewar]]
start = "2014-11-24"
end = "2014-11-27"
hazard = "R"
what_html = 'After the 2014 hostilities: about 350 people moved to UNRWA shelters; hundreds evacuated around the Sheikh Radwan lagoon; UNRWA declared an emergency in Gaza city.'
source_html = '<a href="https://www.ochaopt.org/content/winter-rains-caused-flooding-across-gaza">OCHA</a>, Nov 2014'
[[prewar]]
