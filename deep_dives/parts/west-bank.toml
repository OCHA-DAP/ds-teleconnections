skill_html = '''
<p>Over the West Bank, the September 2026 SEAS5 issuance forecasts a wet start to the season. September–November is at a 15-year wet return period, October–December at 23 years with high skill (r = 0.53), and November–January at 7 years. December–February is only slightly wet (2 years, moderate skill), and January–March slightly dry with low skill. The raw ensemble-mean files give the same picture independently of the app's cube: September–November and October–December are each the 5th-wettest of 46 September forecasts since 1981. SEAS5's wettest September–November hindcasts for the area are 1997, 2015 and 1982, the strongest El Niños in its record. (The skill table counts 17 cells, every 0.25° cell touching the West Bank; the ERA5 series uses the 16 that cover more than 0.5% of it.)</p>
'''

monthly_html = '''
<p>By month, the wet signal sits in October (about double the hindcast mean, the 3rd-wettest of 46 September forecasts) and November (+22%, the 10th). December is slightly wet and January–March slightly dry. Skill for single months is low in the rainy months except November, so read the monthly split as a guide to where the three-month signal sits.</p>
'''

enso_intro_html = '''
<p>The West Bank's rain falls between October and April, mostly from December to February. The hills rise to 700–1,000 m and drop steeply east to the Jordan Valley, about 300 m below sea level, and rainfall more than halves from the western slopes to the valley. This section uses four records:</p>
<ul>
<li>the GPCC gauge analysis;</li>
<li>the Jerusalem rain gauge (St Anne to spring 1948, Jerusalem Central from autumn 1948 to 2015), which is one of GPCC's inputs;</li>
<li>ERA5 over the 16 cells covering the West Bank, a reanalysis that assimilates no rain gauges;</li>
<li>IMERG.</li>
</ul>
'''

stationarity_html = '''
<p>Since the late 1970s, yes; before that, no. Since 1979 the correlation between the October–April total and December–February Niño3.4 is +0.57 in GPCC (to 2024/25), +0.59 at the Jerusalem gauge (to 2013/14) and +0.59 in ERA5 (to 2025/26). Each is significant at p &lt; 0.001 and unchanged by detrending. Before 1979 the same records give −0.03 (GPCC, from 1891), −0.16 (Jerusalem, from 1909) and −0.21 (ERA5, from 1950). Over each full record the correlation is weak (+0.16 to +0.30). As in Gaza, the switch shows in the gauge records as well as the reanalysis.</p>
<p>The literature found the same break. Price et al. (1998) saw significant correlations only in the last 25 years of their Israeli record, and Alpert et al. (2005) found no connection before the 1970s. A 2026 Israel Meteorological Service technical report (not peer-reviewed) finds r ≈ 0.50–0.55 over the last 50 years, strongest in the Judean hills, the Shephelah and the northern Negev. IMERG (1998–) agrees on the sign but is weaker (r = +0.30, not significant over 28 winters).</p>
'''

history_html = '''
<p>Since 1979, 9 of the 14 El Niño winters in GPCC fell in the West Bank's wettest third and none in the driest; in ERA5, 9 and one. La Niña winters ran the other way: 2 of 19 in the wettest third and 11 in the driest. Before 1979 El Niño winters were spread evenly (9 wettest, 7 driest of 25).</p>
'''

strong_html = '''
<p>None of the six strong El Niños since 1979 was in the driest third in GPCC or at the Jerusalem gauge, a stronger result than in Gaza. Two of the other records disagree for single winters: ERA5 puts 2009/10 just inside its driest third (32nd percentile), and IMERG puts 2015/16, the strongest event in the record, there too (21st percentile). The Israel Meteorological Service says a dry 2026/27 “like 2015/16” cannot be ruled out. The two wettest strong events both followed major volcanic eruptions: 1982/83, and 1991/92, Jerusalem's wettest winter on record, with heavy snow in February 1992. That makes them doubtful analogues for a winter forecast to be warm. 1997/98 was wet in GPCC and ERA5 but normal at Jerusalem; 2009/10, 2015/16 and 2023/24 were near normal in GPCC. The two strong events before 1979 were dry or normal.</p>
'''

trimester_html = '''
<p>The concurrent signal runs through the whole season and is strongest in October–December (r = 0.47–0.54). The August–October Niño3.4, known before the season starts, predicts the season total nearly as well (r = 0.49 in GPCC, 0.54 in ERA5). Unlike in Gaza, it still says something about January–March (0.33–0.37).</p>
'''

daily_html = '''
<p>A wetter El Niño winter here is a winter with more rain days and more moderate-to-heavy days. Rain days rise with Niño3.4 in all three records (r = 0.51–0.56): ERA5 has 65 in an average El Niño winter against 50 in a La Niña winter, IMERG 58 against 46, and the Jerusalem gauge 48 against 38. Days of 10 mm or more rise in ERA5 and at Jerusalem (20 against 14). At Jerusalem so do days of 20 mm or more (10 against 7, r = +0.41). The single wettest day shows no consistent link, and nor do cold nights in ERA5. Windy days are a little more frequent (r = +0.31). More wet days should mean wetter ground, so that a given storm runs off faster into the wadis; that is a reasonable expectation, not something tested here.</p>
'''

impacts_intro_html = '''
<p>Winter weather does much less harm in the West Bank than in Gaza, and what it does is poorly counted. The record has two large pre-war events:</p>
<ul>
<li>the floods of 7–10 January 2013: about 1,000 homes damaged, more than 260 mm in 48 hours in parts of the north, 4 deaths;</li>
<li>Storm Alexa's snow in December 2013: 7,128 Civil Defence operations, communities cut off for days, at least 300 people displaced in herding and Bedouin communities.</li>
</ul>
<p>Since October 2023, UN reporting on the West Bank has been dominated by the conflict, and the UN has quantified one weather event in three winters. Most other figures come from the Palestinian Civil Defence via the media. That gap shows in the timeline below. Storm Byron gave the West Bank its wettest day in IMERG's 28-year record, about 97 mm averaged over the whole territory on 11 December 2025, yet no West Bank impact from it was found in public reporting. Whether that reflects little damage or little counting cannot be told from what is published.</p>
<p>The impacts fall on three groups, set out by theme in section 5:</p>
<ul>
<li>refugee camps and towns, where drainage is blocked by the Barrier or destroyed (water, sewage and stormwater networks in the northern camps were bulldozed), and the hill towns when it snows;</li>
<li>herding and Bedouin communities in Area C living in tents and tin structures, who have lost shelters, animal pens and fodder in the storms that have been reported;</li>
<li>farmers, whose greenhouses in the north and the Jordan Valley take the wind, frost and flood damage, and whose rainfed crops and pasture depend on the season's rain (section 6).</li>
</ul>
<p>Deaths come from flash floods in wadis and from heating fires. No hypothermia death was found for the West Bank in any winter.</p>
'''

prewar_html = '''
<p>Before October 2023: the two large events, and the recurring ones (snow on the hills, heating fires, flash floods). Several figures are counts of rescues or assistance rather than of people affected.</p>
'''

range_intro_html = '''
<p>There is not enough counted impact data for the West Bank to say how many households a winter will affect. What the record can show is how often the weather that has caused harm comes, whether El Niño changes that, how big a week of rain is against the year, and who is exposed now.</p>
'''

week_html = "The Jerusalem gauge, a single hill-top point whose last complete season is 2013/14, runs a few points higher on every rung than the IMERG area average: compare the IMERG column with an area forecast and the gauge column with a point. Byron's week, half an average year and the wettest week in IMERG's record, had no impact attributed to it in public reporting; the second-wettest, 7–13 January 2013 (166 mm, about 40% of a year), brought the largest flood event in this page's record, with more than 260 mm in 48 hours locally in the north."
first_storm_html = '''
<p>In 7 of the 8 El Niño winters of the IMERG record, the first storm of 20 mm or more over the West Bank came before 1 December, against 14 of 28 winters overall. Against the other winters that is unlikely to be chance alone (p ≈ 0.03), though eight winters is a small sample. Last winter's most damaging West Bank event, on 28–30 December 2025, came in a December that gave Jerusalem more than 237 mm, its wettest December since 2013 according to the Palestinian Meteorological Department (via Al Jazeera).</p>
'''

range_after_html = '''
<h3>Snow</h3>
<table><thead><tr><th>Winter</th><th>Snow with reported impacts</th><th>ENSO phase (DJF)</th></tr></thead><tbody>
<tr><td>1991/92</td><td>February 1992: heavy snow across the hills (Jerusalem's wettest winter on record)</td><td>El Niño, after Pinatubo</td></tr>
<tr><td>2012/13</td><td>9–10 January 2013, at the end of the floods</td><td>neutral</td></tr>
<tr><td>2013/14</td><td>Storm Alexa, 12–14 December 2013: 60–100 cm, 15% of the West Bank snow-covered</td><td>neutral</td></tr>
<tr><td>2014/15</td><td>January (Storm Huda) and 19–21 February 2015: 215 rescues, Hebron's roads closed</td><td>weak El Niño</td></tr>
<tr><td>2020/21</td><td>17–18 February 2021: 165 Civil Defence cases, 1 road death</td><td>La Niña</td></tr>
<tr><td>2021/22</td><td>26–27 January 2022: 20 cm, 400 incidents, 2 deaths in a house fire</td><td>La Niña</td></tr>
<tr><td>2024/25, 2025/26</td><td>light snow only (February 2025, January 2026)</td><td>La Niña</td></tr>
</tbody></table>
<p>Snow with impacts has come in every ENSO phase; over the last 15 years, more often in neutral and La Niña winters than in El Niño ones. The Israel Meteorological Service finds a slight, non-significant tilt towards more Jerusalem snow days in strong El Niño winters, from seven cases. With every forecast pointing to a warm winter, a snowstorm like Alexa is less likely than usual this year but not ruled out. The ERA5 cells are too smooth to see the hill-town snow, so this page does not estimate snow odds.</p>
<h3>Who is exposed, by theme</h3>
<p>Three groups carry most of the West Bank's winter risk, and each meets the weather in a different way: camps and towns through drainage, power and roads; herding communities through shelters, animals and fodder; farmers through their crops. Conflict, not weather, has shaped all three since 2023, and the figures below keep the two apart.</p>

<h4 style="font-size:14px;margin:20px 0 4px">Refugee camps and towns</h4>
<p>Going into this winter:</p>
<ul>
<li>About 34,000 refugees remain displaced from the Jenin, Tulkarm and Nur Shams camps (UNRWA, 10 September 2026). None have returned; military closure orders ran to 20 August 2026 for Jenin camp and 30 September 2026 for Tulkarm and Nur Shams, and their status since was not found. Over 80% of the displaced now rent (UNRWA, September 2026), and only 8% could pay rent regularly in mid-2025 (Shelter Cluster); a May 2025 assessment had found just over half renting, 30% staying with relatives and 20% in public shelters or other temporary places (OCHA). Most of the about 4,000 displaced from El Far'a camp returned in February 2025.</li>
<li>Satellite imagery from January–February 2026 shows 637 structures destroyed and 1,521 damaged or destroyed in total across the three camps: about half of all structures in Jenin and Nur Shams camps and 37% in Tulkarm camp (UNOSAT, preliminary). Water, sewage and stormwater infrastructure in the camps was bulldozed (OCHA).</li>
<li>Elsewhere, towns partly enclosed by the Barrier drain badly in heavy rain. In the WASH Cluster's 2022 community inventory, 167 of 845 communities reported flooding at least once in the previous three years (10,173 households, most of them in Jerusalem governorate).</li>
</ul>
<table><thead><tr><th>Event</th><th>What winter weather did</th><th>Source</th></tr></thead><tbody>
<tr><td>7–10 January 2013, floods</td><td>Qalqiliya and Tulkarm cities and Kafr Aqab flooded because the Barrier obstructed their drainage, and Hebron's Old City because of roadblocks. Villages such as Kafr Qaddum were cut off when the only road they are allowed to use flooded. Across the oPt, prolonged power cuts, flooded roads and closed schools. 618 homes damaged in 91 communities of the northern West Bank.</td><td><a href="https://www.un.org/unispal/document/auto-insert-194567/">OCHA</a>, 16 Jan 2013</td></tr>
<tr><td>11–14 December 2013, Storm Alexa</td><td>Several floods and house fires reported in the 19 refugee camps, many of them left without adequate power; 80% of Ramallah city without power on the first day; most schools closed. A girl in Bethlehem died after an ambulance could not reach her through the snow for two days.</td><td>OCHA, <a href="https://www.un.org/unispal/document/auto-insert-197890/">14</a> and <a href="https://www.un.org/unispal/document/auto-insert-202086/">16 Dec 2013</a></td></tr>
<tr><td>January 2024, rain</td><td><em>Rain on the bulldozed streets of the northern camps showed the scale of the destruction: streets turned to mud and potholes, hard for vehicles (no numbers).</em></td><td><a href="https://wafa.ps/Pages/Details/88932">WAFA</a>, 27 Jan 2024</td></tr>
<tr><td>29 December 2025, storm</td><td><em>Civil Defence evacuated flooded homes south of Hebron and pumped water from homes, a kindergarten and two nurseries; road collapses and blocked rainwater drains. 115 Civil Defence incidents in 11 hours across several governorates</em> (relayed by OCHA).</td><td><a href="https://www.ochaopt.org/content/humanitarian-situation-update-352-west-bank">OCHA HSU #352</a>; <a href="https://www.aljazeera.net/news/2025/12/29/أمطار-غزيرة-وسيول-تضرب-الضفة-وتخلف">Al Jazeera Arabic</a> (Civil Defence), 29 Dec 2025</td></tr>
</tbody></table>
<p class="small">No numbers on camp flooding, power cuts or service interruptions from weather were found for any winter since 2023. The displaced from the northern camps now mostly rent, which suggests their winter risks lie more in heating costs and the condition of rented housing than in flooding <em>(in January 2026 about 100 Tulkarm families were living in buildings without doors or windows, Al Jazeera)</em>.</p>

<h4 style="font-size:14px;margin:20px 0 4px">Herding communities in the Jordan Valley and Area C</h4>
<p>Going into this winter:</p>
<ul>
<li>The Shelter Cluster's Area C dataset covers 315 communities (215,703 people) with 30,173 residential shelters, of which 2,242 need rehabilitation (January 2026). Herding and Bedouin communities are a subset; 42 of the listed communities are marked as forcibly displaced and no longer existing. No count of people in tents was found.</li>
<li>Displacement by settler attacks and related access restrictions, separate from the weather: 130 communities fully or partly displaced and more than 6,400 people since January 2023, over 2,500 of them in 2026, mostly in Bedouin and herding communities in Area C (OCHA, 4 September 2026). Ras Ein al 'Auja near Jericho, about 600 people, was fully displaced in January 2026.</li>
<li>After the 2024/25 drought (33% of the mean rainfall at Jericho by early March 2025), 16% of livestock-keeping households in Area C reported animal deaths from malnutrition, drought or lack of feed, and 81–90% of livestock keepers cited the cost of feed as a problem (FAO, survey of July–August 2025). The survey does not separate drought from pasture lost to settler violence: 65% of Area C livestock keepers reported difficulty reaching pasture.</li>
</ul>
<table><thead><tr><th>Event</th><th>What winter weather did</th><th>Source</th></tr></thead><tbody>
<tr><td>7–10 January 2013, floods</td><td>Hundreds of residential tents and shelters in Area C herding communities damaged; a sharp rise in livestock deaths and disease, made worse by the destruction of cereal crops grown for feed, which forced herders to buy fodder. Emergency funds later paid to rehabilitate 272 animal sheds in 66 communities.</td><td><a href="https://www.un.org/unispal/document/auto-insert-204416/">OCHA Humanitarian Monitor</a>, Feb 2013</td></tr>
<tr><td>11–14 December 2013, Storm Alexa</td><td>At least 300 people displaced in herding and Bedouin communities in Hebron governorate; <em>55,760 m² of animal sheds damaged, mainly in the southern West Bank (MoA); 281,000 animals died in the West Bank, most of them poultry (MoA and FAO)</em>. In the Jordan Valley, demolitions the day before the storm had displaced 41 people (conflict, not weather).</td><td>OCHA, <a href="https://www.un.org/unispal/document/auto-insert-202086/">16 Dec 2013</a>; <a href="https://unispal.un.org/pdfs/HB1213.pdf">Humanitarian Bulletin</a>, Dec 2013; <a href="https://www.un.org/unispal/document/auto-insert-197374/">OCHA PoC</a>, 23 Dec 2013</td></tr>
<tr><td>28–30 December 2025, storm</td><td>At least 66 households (about 300 people) in 18 mainly herding and Bedouin communities had tents, livestock barracks, fodder stores or animal shelters damaged or destroyed; in several cases structures recently rebuilt after settler attacks were damaged again. The Shelter Cluster counted more than 120 households in 18 communities affected by the winter storms of December–January; its count cannot be split by storm and probably overlaps OCHA's.</td><td><a href="https://www.ochaopt.org/content/humanitarian-situation-update-352-west-bank">OCHA HSU #352</a>; <a href="https://www.sheltercluster.org/palestine/documents/shelter-cluster-sitrep-january-2026">Shelter Cluster</a></td></tr>
</tbody></table>
<p class="small">No count of livestock killed by cold, floods or snow was found for any winter since 2015. Lambing falls in mid-winter; OCHA flagged the risk to lambs during Alexa, but no lamb losses were measured. No herding community is known to have been displaced by weather alone beyond a few days; long-term displacement is conflict-driven.</p>

<h4 style="font-size:14px;margin:20px 0 4px">Farming: field crops, greenhouses, trees and rangeland</h4>
<ul>
<li><strong>Field crops</strong> as a whole (about 198,000 dunums) are 95% rainfed and <strong>tree crops</strong> (about 641,000 dunums) 91% rainfed; Jericho and Al-Aghwar is the exception, where about 96% of the tree area is irrigated (the valley grows dates, citrus and bananas). Section 6 shows how these follow the winter's rain and El Niño.</li>
<li><strong>Greenhouses</strong>: 28,743 dunums of plastic houses, 77% of them in Jenin, Tulkarm and Tubas and another 8% in Jericho; vegetables as a whole are only 13% rainfed. Their winter hazards are wind, snow load, frost and flooding, not the season's rainfall.</li>
<li><strong>Rangeland</strong>: about 2 million dunums, of which Palestinians were allowed to graze about 621,000 in 2014 (PA figures); settler violence and displacement have restricted it further since (no updated figure).</li>
</ul>
<table><thead><tr><th>Event</th><th>What winter weather did</th><th>Source</th></tr></thead><tbody>
<tr><td>7–10 January 2013, floods</td><td><em>More than 4,200 greenhouses damaged across the West Bank and Gaza (MoA)</em>, with damage to greenhouses and open fields particularly high in the northern West Bank; more than 100,000 chickens dead in the northern West Bank; <em>US$16.5 million of agricultural damage (MoA, West Bank and Gaza)</em>.</td><td>OCHA, <a href="https://www.un.org/unispal/document/auto-insert-194567/">16 Jan</a> and <a href="https://www.un.org/unispal/document/auto-insert-204416/">Mar 2013</a></td></tr>
<tr><td>11–14 December 2013, Storm Alexa</td><td><em>West Bank production losses of about US$7 million in greenhouses, US$4.6 million in open fields and US$3 million in sheep milk (MoA and FAO, via OCHA); grape production in Hebron, Dura, Yatta and Bethlehem expected to be lost for two years (PA damage assessment).</em></td><td><a href="https://unispal.un.org/pdfs/HB1213.pdf">OCHA Humanitarian Bulletin</a>; <a href="https://openknowledge.worldbank.org/bitstreams/2a3faba9-9309-52d0-badd-ae5b23a7ffd3/download">PA damage assessment</a>, Feb 2014</td></tr>
<tr><td>17–18 January 2022, frost</td><td><em>About 6,000 of 80,000 dunums of open-field crops and about 600 of 32,000 dunums of protected crops damaged, 60% of the damage in the Jordan Valley (MoA).</em></td><td><a href="https://wafa.ps/Pages/Details/39953">WAFA</a>, 19 Jan 2022</td></tr>
</tbody></table>
<p class="small">PCBS and MoA Agricultural Census 2021 (areas, irrigation, greenhouses); PA data in the Alexa damage assessment (rangeland). No storm damage to greenhouses or orchards was found reported for 2025/26.</p>
<p class="small">In the three event tables, italics mark impact figures from Palestinian authorities (ministries, Civil Defence) or the media, including when the UN relays them.</p>

<h3>Deaths</h3>
<table><thead><tr><th>Cause</th><th>Events</th></tr></thead><tbody>
<tr><td>Flash floods and drowning</td><td>8 January 2013, Anabta (2); 25–27 April 2018, Al Fawwar camp and east of Bethlehem (3, a spring storm); 24–25 January 2020, Jerusalem (1); 29 December 2025 (1, place of residence disputed)</td></tr>
<tr><td>House fires and heating</td><td>25 February 2015, Hebron (3 children); January–February 2022 (4, IFRC), including 2 in a house fire in Adh-Dhahiriya</td></tr>
<tr><td>Collapse and snow</td><td>19 March 2024, wall collapse in Beit Imrin (1); December 2013, a roof fall and a dialysis patient cut off by snow (2); February 2021, a road crash in snow (1)</td></tr>
</tbody></table>
<p>Attribution is mixed (UN, IFRC, Civil Defence via the media), so the rows should not be summed.</p>
<h3>Plans</h3>
<p>No 2026/27 winterisation plan written for the West Bank was found by 2 October 2026. The West Bank's winter lines sit inside the calendar-2026 appeals:</p>
<ul>
<li>the Flash Appeal's West Bank shelter response: 62,900 people, US$28.4 million, including weatherproofing, insulation, heaters and blankets;</li>
<li>UNRWA's West Bank shelter and household items: 11,500 households, US$21.9 million.</li>
</ul>
<p>UNICEF's Winterization Plan 2026–2027 (17 September 2026) seeks US$97.5 million for 540,000 children in Gaza and the West Bank; its costed lines are almost all for Gaza. A US$1.0 million Humanitarian Fund allocation for West Bank shelter gaps, in Area C and for the displaced, was approved in January 2026. Funding is reported only for the oPt as a whole.</p>
'''

