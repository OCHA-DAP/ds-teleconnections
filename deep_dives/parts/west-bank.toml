# ---- Section 6: farming (levant_agri.py). Zones after ARIJ's agro-ecological zones, by the governorates PCBS reports.
[agri]
intro_html = '''
<p>Most West Bank farming depends on the winter rain. The West Bank is commonly divided into four agro-ecological zones (Dudeen 2001): the <strong>Central Highlands</strong> from Jenin to Hebron, almost all rainfed and mostly under olives, grapes and other fruit trees, with winter cereals and pulses on the rest; the <strong>semi-coastal plain</strong> in the northwest, the wettest zone, with rainfed field crops and irrigated vegetables; the <strong>Eastern Slopes</strong>, a dry transition zone of marginal rainfed barley, wheat and olives and spring grazing; and the <strong>Jordan Valley</strong>, which gets 100–200 mm and is farmed on springs and groundwater. Crop statistics are published by governorate, and the Eastern Slopes cut across the highland governorates, so the yield figures below use three zones and the Eastern Slopes appear through satellite vegetation data.</p>
<p>One convention throughout this section: a crop year is named after its harvest and follows the winter before it. This winter, 2026/27, will shape the cereal and pulse harvest of May–June 2027, spring grazing in 2027 and the olive harvest of October–November 2027. The olive harvest that starts this month was set by last winter and by the size of the previous crop.</p>
'''

cover_html = "<p>Split by land cover instead of by zone, the same satellite record separates the crops that ride out a dry year from those that do not. Tree cover (denser orchards, groves and woodland) has the weakest link to the winter's rain and, in the hills and on the plain, the smallest swings; its El Niño springs were above normal in 8 of 8 years, but only slightly. Cropland and the shrubland and grassland that cover most of the West Bank (rangeland and sparse olive groves) swing more and follow El Niño about equally. On the semi-coastal plain no group has a significant link to El Niño, and its cropland, much of it irrigated, has none at all. In the Jordan Valley, every group swings widely, and the valley's cropland and rangeland had the largest El Niño and La Niña departures.</p>"
ndvi_html = "The semi-coastal plain, the wettest zone and partly irrigated, has the weakest link to El Niño: rain there is less often what limits growth."
field_html = '''
<p>Wheat and barley are sown in November–December and harvested in May–June. In the West Bank, 98% of their area is rainfed (2021 census); about a third of it is in Hebron governorate, on the southern hills and the edge of the eastern slopes, and more than a quarter in Jenin. Yields follow the winter's rain, loosely: the two worst harvests followed the two driest winters with official figures (1998/99 and 2007/08), but two other dry winters (2013/14 and 2016/17) have no official yield, and two poor harvests (2001, 2011) followed winters that were only somewhat dry or near normal. The total is not everything: when the rain comes, frost, and heat during grain filling also matter, so a wet winter is no guarantee (2019, after a very wet El Niño winter, was slightly below trend) and a dry one can still yield well (2000).</p>
'''
olive_html = '''
<p>Olives are the West Bank's main tree crop and almost all rainfed. The crop swings by a factor of two to five from one year to the next because trees alternate heavy and light crops (alternate bearing), and that cycle, not the winter, sets most of the change. With it taken out, national production shows no clear link to El Niño (official years only). By zone (olives pressed, PCBS, 2003–2019), bigger crops lean weakly towards wetter winters, more in the semi-coastal plain than in the highlands, but the lean rests largely on 2019, a very wet winter followed by the largest crop of the period, and it does not carry through to El Niño: in these years El Niño winters were not reliably wet (2009/10 was below average).</p>
<p>Since October 2023, access has shaped the harvest as much as the weather. Between 1 and 27 October 2025 OCHA documented 126 olive-harvest-related settler attacks, against 110 in the same period of 2024 and 30–46 in the same window of 2020–2023, with more than 4,000 trees and saplings vandalized. The 2025 harvest, after a winter (2024/25) tied with 1998/99 as the driest in ERA5's record, was among the smallest in years: early estimates of 7,000–8,000 tonnes of oil, against 27,300 tonnes in 2024 and an average of about 22,500 (MAS, as reported by Al Jazeera). 2024 was a large crop, so alternate bearing alone would have made 2025 smaller; bearing, drought and access cannot be separated in these figures.</p>
'''
veg_html = '''
<p>The NOAA record starts in 1982 and so covers all six strong El Niño winters since then. The springs after 1982/83 and 1997/98 were among the greenest on record, the one after 2015/16 close to the middle, the one after 2023/24 somewhat above it, and the spring after 2009/10, a below-average winter, well below it. The wettest winter in ERA5's record, 1991/92, left cropland below the middle: its December–February was also one of the two coldest in that record. All land, which includes the rangeland of the eastern slopes, responds more to El Niño than cropland does, as the zone figures above show for the drier zones.</p>
'''
strong_html = "<p>The six winters with December–February Niño3.4 of +1.5 °C or more since 1982, the closest analogues for 2026/27.</p>"
after_html = '''
<h3>What the record suggests for 2026/27</h3>
<p>If the forecasts' wet October–December holds, the record leans towards a reasonable spring for rainfed cereals, pulses and pasture in 2027, in every zone and most visibly in the drier highlands, eastern slopes and Jordan Valley margins. What it shows is mainly a lower chance of a bad year, not a bumper one, and it rests on 9–14 El Niño years per record: the intervals around every count above are wide, and this is not a crop forecast. Olives will be set more by alternate bearing and by access than by the winter: a large 2026 crop would make a smaller 2027 crop likely whatever the rain.</p>
<p>Three limits apply. Every agricultural record here starts after 1979, inside the period in which the El Niño link to West Bank rain exists, and the coming El Niño is likely to be stronger than any in them. The timing of the rain, frost and spring heat also matter, and the season total does not capture them. And much of what will decide the 2027 harvest is not weather: access to land near settlements and behind the Barrier, settler violence, and the cost and availability of water and inputs.</p>
'''

[agri.strong_notes]
"1983" = "Wet winter, green spring. No official yield figures before 1994."
"1992" = "The wettest winter in ERA5's West Bank record and one of the two coldest (after the Pinatubo eruption)."
"1998" = "Wet winter; the second-greenest cropland spring on record (after 1990); cereals slightly above trend."
"2010" = "Borderline strong (+1.50). A below-average winter despite El Niño; spring below the middle on NOAA's index, near normal on MODIS; cereals near trend."
"2016" = "Near-average winter and spring; cereals above trend."
"2024" = "Near-average winter, green spring by MODIS. FAOSTAT has no figures after 2022."

