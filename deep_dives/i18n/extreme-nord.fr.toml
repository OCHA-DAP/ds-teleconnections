why_html = "Premières prévisions avec une performance modérée pour juillet–septembre sur l'Extrême-Nord."

[[sections_after]]
title = "Données et méthodes"
html = '''
<p><strong>Région.</strong> L'Extrême-Nord selon le polygone COD-AB de niveau 1 (CM004) ; départements selon le COD-AB de niveau 2.</p>
<p><strong>Pluies.</strong>
<ul>
<li><strong>GPCC</strong>, 1°, produit combiné NOAA PSL : Full Data v2020 jusqu'en 2019, puis Monitoring. Moyenne pondérée par la surface sur la région. Les produits 2026 (première estimation et suivi) proviennent du DWD, et le nombre de stations de Full Data v2022.</li>
<li><strong>CHIRPS v3</strong> : fichiers mensuels Afrique du CHC, lus par fenêtres sur la région.</li>
<li><strong>CHIRPS v2</strong> : IRI Data Library.</li>
<li><strong>IMERG</strong> (late run v7) et <strong>ERA5</strong> : moyennes par unité administrative tirées de la base de données de l'équipe (ds-raster-stats).</li>
</ul></p>
<p><strong>Saison et périodes de référence.</strong> Le cumul de la saison des pluies porte sur juin–septembre. La relation avec l'ENSO porte sur 1981–2025 (IMERG 2001–2025), tendance retirée avant le calcul des tiers. Les comparaisons 2026 utilisent une même période de référence pour tous les produits, 2001–2025, fixée par le début d'IMERG.</p>
<p><strong>ENSO.</strong> Niño3.4 de la NOAA PSL, base ERSST v5 : la série figée de la synthèse mondiale, qui s'arrête en juin 2026. El Niño : ≥ +0,5 °C ; La Niña : ≤ −0,5 °C, en moyenne sur juillet–septembre. Pour 2026, l'ONI officiel du CPC. Les chiffres de prévision proviennent du CPC de la NOAA (discussion de septembre 2026 et perspectives de l'indice relatif) et de l'IRI (septembre 2026).</p>
<p><strong>Végétation.</strong> Indicateurs décadaires du JRC ASAP par région (zFPARc et SPI-3 sur les cultures), comme dans ds-asap-trends.</p>
<p><strong>Inondations.</strong> AER FloodScan SFED, part journalière de chaque unité détectée comme inondée, 1998–2026, tirée de la base de données de l'équipe. FloodScan ne détecte que les étendues d'eau assez grandes.</p>
<p><strong>Température.</strong> Température mensuelle moyenne à 2 m d'ERA5 (CDS), moyenne des mailles de 0,25° qui touchent la région.</p>
<p><strong>Sécurité alimentaire.</strong> Résultats du Cadre Harmonisé via HDX/HAPI (copie IPC de l'équipe).</p>
<p><strong>Performance des prévisions.</strong> Performance (skill) de SEAS5 d'après le cube seas5-skill de l'équipe : moyenne d'ensemble comparée à ERA5, 1981–2025, tendance retirée.</p>
<p><strong>Rapports externes</strong> (FEWS NET, PREGEC, AGRHYMET, notes ASAP, SMIAR, ONACC, NOAA, IRI) cités tels que publiés ; nous n'avons pas vu les données du MINADER ni de la DNM.</p>
<p><strong>Traduction.</strong> Cette page est la version française de la page anglaise, produite à partir des mêmes calculs. Les citations de sources anglophones (FEWS NET, SMIAR, notes ASAP) sont traduites par nos soins ; les titres des références sont laissés dans leur langue d'origine.</p>
'''

