# Cameroun, Extrême-Nord — version française de deep_dives/extreme-nord.toml, rendue par
# extreme_nord_deep_dive.py dans docs/enso/extreme-nord/fr/ à partir de la même analyse.
# Ce fichier est dans i18n/ pour que enso_deep_dive.py (qui lit deep_dives/*.toml) ne le prenne pas
# pour un pays. À chaque reconstruction, réconcilier le texte avec les chiffres affichés par report(),
# comme pour la version anglaise, et garder les deux versions alignées.
name = "Cameroun : Extrême-Nord"
page_title = "El Niño et l'Extrême-Nord"
subtitle = "Ce que l'El Niño de 2026 a fait à l'Extrême-Nord du Cameroun, ce qu'il peut encore faire, et quelle confiance accorder à chaque jeu de données"

summary_html = '''
<p><strong>1. El Niño fait pencher la balance vers une saison des pluies sèche, sans la décider.</strong> Sur les neuf saisons El Niño depuis 1981, cinq à sept (selon le jeu de données) se sont classées dans le tiers le plus sec des cumuls de juin–septembre, et au plus une dans le tiers le plus humide. La probabilité d'une saison sèche passe ainsi d'environ une sur trois à environ deux sur trois. Dans les produits calés sur les stations (GPCC, CHIRPS), la corrélation est d'environ −0,3 : El Niño explique environ un dixième de la variabilité d'une année à l'autre. Les épisodes forts ont différé : 1987 et 1997 ont été secs, 2015 proche de la normale dans GPCC et CHIRPS.</p>
<p><strong>2. La saison 2026 a été tardive, inégale et plus sèche au nord. Les données divergent sur l'ampleur.</strong> Pour juin–août 2026, les cinq produits de précipitations vont de 46 % à 109 % de leur moyenne 2001–2025. Pour IMERG, c'est la saison la plus sèche depuis 2001, et FEWS NET estime les pluies de juin–septembre inférieures de 20 à 50 % à la moyenne dans le Logone-et-Chari. CHIRPS place la région proche de la normale. La biomasse des cultures a pris du retard en juin et était revenue à la normale mi-septembre. Les produits satellitaires et la réanalyse montrent tous un mois de mai sec, et IMERG, le seul qui couvre déjà septembre, une fin de saison sèche. Aucune station de l'Extrême-Nord n'apparaît dans les archives internationales pour 2025 ou 2026 : seules les données des stations nationales permettront de trancher.</p>
<p><strong>3. Les inondations ne suivent pas El Niño ici.</strong> Les plus grandes années d'inondation depuis 1998 (2024, 2010, 2022, 2019) étaient neutres ou La Niña. Au 30 septembre, 2026 présente la plus petite surface inondée de la série FloodScan. Mais 26 mm de pluie sont tombés sur la région le 29 septembre, et les hautes eaux du Logone arrivent normalement en octobre–novembre.</p>
<p><strong>4. L'effet d'El Niño le plus net encore à venir est la chaleur.</strong> La température de mars–mai dans l'Extrême-Nord suit l'El Niño de l'hiver précédent (r = +0,51). Après l'El Niño 2023/24 est venue la saison mars–mai la plus chaude jamais enregistrée. L'El Niño actuel, qui approche de son pic, est plus fort : un mars–mai 2027 plus chaud que la normale est probable. C'est la saison chaude qui précède la soudure.</p>
<p><strong>5. Pour les pluies de 2027, El Niño ne donne aucune indication.</strong> Par le passé, la saison qui suit un El Niño fort est allée de très sèche (1983) à très humide (2024, la plus humide dans GPCC). Ce qui comptera, c'est l'état de l'ENSO en juillet–septembre 2027, qu'aucune prévision n'atteint encore. Les prévisions saisonnières pour ces mois ne deviennent utiles qu'à partir de la prévision émise en juin 2027.</p>
'''

forecast_html = '''
<p><strong>L'épisode.</strong> L'indice océanique Niño (ONI) officiel de la NOAA atteint +1,8 °C pour juin–août 2026. C'est la valeur la plus élevée pour cette période depuis le début des relevés en 1950, au-dessus de 1997 (+1,5) et de 2015 (+1,4). 2026 est donc un El Niño estival plus fort que tous les analogues présentés plus bas. Les perspectives de septembre de la NOAA donnent El Niño à 100 % jusqu'en janvier–mars 2027, avec un pic en octobre–décembre à une médiane de +2,67 °C sur son indice relatif. L'épisode s'affaiblit ensuite : El Niño à 82 % en mars–mai, puis état neutre le plus probable (55 %) en avril–juin 2027. La Niña reste à 3 % ou moins dans toutes les perspectives jusqu'en mai–juillet 2027. Les perspectives de l'IRI, sur l'indice traditionnel, gardent El Niño plus probable qu'improbable jusqu'en mai–juillet (61 %). Les deux s'accordent sur un point : aucune prévision ENSO publiée n'atteint la saison des pluies 2027.</p>
<p><strong>Où en est le calendrier.</strong> L'Extrême-Nord reçoit ses pluies de mai à octobre, surtout en juillet–septembre, avec un pic en août. Les pluies de 2026, la période sur laquelle El Niño agit le plus directement, sont terminées. Restent :</p>
<ul>
<li>la récolte des céréales pluviales (septembre–novembre) ;</li>
<li>les hautes eaux du Logone (octobre–novembre dans le Logone-et-Chari) ;</li>
<li>le sorgho de contre-saison (muskuwaari), cultivé sur les plaines argileuses grâce à l'humidité résiduelle ;</li>
<li>la saison chaude (mars–mai) ;</li>
<li>la soudure (juin–août 2027), période sur laquelle portent les projections du Cadre Harmonisé.</li>
</ul>
'''

enso_html = '''
<p>Le nord du Cameroun appartient au régime de mousson du Sahel, où El Niño est associé à une mousson ouest-africaine plus faible et à moins de pluies en juillet–septembre. Ce lien est bien documenté pour le Sahel dans son ensemble. Il s'est renforcé après 1970 environ (Janicot et al. 1996 ; Losada et al. 2012) et reste modeste : l'ENSO explique environ un dixième de la variance des pluies au Sahel, moins que les températures de surface de l'Atlantique et de la Méditerranée (Diatta &amp; Fink 2014). Le catalogue de la synthèse mondiale classe le Cameroun « modéré, El Niño plus sec, juin–septembre ». Cette section le vérifie pour le seul Extrême-Nord, dans cinq jeux de données.</p>
<p>Le résultat est cohérent d'un jeu de données à l'autre quant au sens de l'effet et à son poids sur les probabilités, mais pas quant à son intensité. Dans tous les jeux de données, les saisons El Niño se concentrent dans le tiers le plus sec et n'atteignent presque jamais le tiers le plus humide. Les corrélations sans tendance vont de −0,23 à −0,36, à l'exception d'ERA5 (−0,47).</p>
<p>ERA5 appelle une réserve. Il ne montre pas la remontée des pluies au Sahel depuis les années 1980 que montrent tous les jeux de données de stations et satellitaires : environ −1 mm par décennie, contre +30 à +38. Il donne aussi à 2026 un déficit que ni la végétation ni CHIRPS ne confirment (section 3). Le même défaut, un assèchement artificiel sur l'Afrique centrale, a été constaté dans ERA5 sur la République centrafricaine. La corrélation plus forte d'ERA5 est à lire comme une borne supérieure.</p>
'''

enso_after_table_html = '''
<p>Sur 1950–2025, GPCC (seule analyse de stations assez longue) donne une corrélation sans tendance de −0,26 : 7 saisons El Niño sur 13 dans le tiers le plus sec et 2 dans le plus humide. La corrélation était plus faible sur 1950–1980 (−0,19, quatre saisons El Niño, non significative) que sur 1981–2025 (−0,30), comme le prévoit la littérature sur le Sahel.</p>
'''

strong_html = '''
<p>Quatre saisons depuis 1950 ont eu un Niño3.4 de juillet–septembre de +1,3 °C ou plus. Sur l'ONI de juin–août du CPC, seul indice disponible pour 2026 à ce stade, aucune n'atteignait les +1,8 de 2026 (1997 : +1,5 ; 2015 : +1,4). 1987 et 1997 figurent parmi les saisons les plus sèches dans les produits calés sur les stations. 2015 était proche de la médiane dans GPCC et CHIRPS (ERA5 : 22e centile). Pour 2023, les jeux de données divergent : IMERG la place dans son dixième le plus sec, CHIRPS au-dessus de la médiane.</p>
'''

gauges_html = '''
<p>Tous les jeux de données de cette page s'appuient sur des stations, et ici les stations se sont raréfiées. Les mailles GPCC sur la région comptaient six à neuf stations par mois en saison des pluies des années 1950 aux années 1980, et environ cinq dans les années 1990. On est ensuite tombé à une ou deux jusqu'en 2004, puis à aucune pendant les mois de pluie (une seule station en 2020, qui n'a transmis qu'en saison sèche). Avant 1927, il n'y en avait aucune, et les valeurs GPCC de 1891–1903 ne sont que sa climatologie répétée.</p>
<p>La station synoptique de Maroua-Salak apparaît bien dans l'archive journalière de la NOAA (GSOD) la plupart des années jusqu'en 2024, mais de façon lacunaire : 360 jours en 2020, 129 en 2024. Rien n'apparaît pour 2025 ni 2026. Les données de stations utilisées en 2026 par GPCC et CHIRPS viennent donc du Tchad et du Nigeria, ce qui explique une partie des divergences. Cela signifie aussi que les relevés de la Direction de la météorologie nationale (DNM) et de l'ONACC valent davantage que toute nouvelle comparaison de produits satellitaires.</p>
'''

season_html = '''
<p>Cinq produits, une seule saison, et un écart de 46 % à 109 % de la normale pour juin–août. Ce qu'ils ont en commun :</p>
<ul>
<li>Mai a été sec dans les quatre produits satellitaires et de réanalyse (22 à 78 %) : le démarrage a été tardif. GPCC, qui n'a aucune station dans la région, place mai proche de la normale.</li>
<li>Les pluies ont de nouveau baissé en septembre. IMERG, le seul produit qui couvre déjà ce mois, donne 80 %, et l'indice de précipitations normalisé sur 3 mois (SPI-3) de l'ASAP était mi-septembre au 5e rang le plus bas depuis 1989.</li>
</ul>
<p>Ils divergent sur juillet et août. CHIRPS les place proches de la normale. IMERG les situe à 62–71 %, ce qui fait de juin–septembre sa saison la plus sèche depuis 2001 pour la région et pour trois des six départements (Logone-et-Chari, Mayo-Danay et Mayo-Kani). ERA5 est plus bas encore, à 46 %, mais sa série présente les problèmes décrits à la section 2.</p>
'''

depts_html = '''
<p>CHIRPS v3 place tous les départements à ±6 % de la normale pour juin–août. IMERG place tous les départements sous la normale, de 63 % (Logone-et-Chari) à 81 % (Mayo-Sava). Le classement d'IMERG concorde avec l'évaluation de terrain de FEWS NET, qui pointe le Logone-et-Chari (voir plus bas).</p>
'''

veg_html = '''
<p>La végétation est mesurée par satellite, indépendamment de tout produit de pluie. Sur les cultures, la biomasse dans l'Extrême-Nord est restée sous la normale de mai à août, au plus bas mi-mai (score z −0,8) et en juillet (environ −0,3). Elle n'a jamais atteint le seuil d'alerte de l'ASAP et était revenue à la médiane mi-septembre (−0,02, 13e sur 26 saisons). Ce n'est pas le profil de 2015, quand la biomasse des cultures est restée sous le seuil de juin à septembre.</p>
<p>Sur 2001–2025, la biomasse de fin de saison n'est que faiblement liée à El Niño (r = −0,21, non significatif). Trois des cinq années El Niño étaient sous la normale (2002, 2009, 2015) et deux au-dessus (2004, 2023). L'indice de précipitations normalisé sur 3 mois (SPI-3) de l'ASAP, alimenté par une estimation de type CHIRPS, est resté positif jusqu'en août puis est devenu négatif en septembre.</p>
'''

reports_html = '''
<ul>
<li><strong>Concertation du PREGEC (dispositif régional de prévention et de gestion des crises alimentaires, CILSS), septembre 2026.</strong> Il décrit une saison « influencée par El Niño », avec des pluies proches de la normale à déficitaires et de longues séquences sèches au Sahel, en Afrique de l'Ouest et au Cameroun. Les niveaux du bassin du lac Tchad étaient inférieurs à ceux de 2025, qu'il qualifie d'année excédentaire.</li>
<li><strong>FEWS NET, Key Message Update de septembre 2026.</strong> Les pluies de juin–septembre ont été inférieures de 20 à 50 % à la moyenne dans le Logone-et-Chari, et une récolte inférieure à la moyenne est attendue. Il classe le Mayo-Sava, le Mayo-Tsanaga et le Logone-et-Chari en Crise (phase 3 de l'IPC) jusqu'en septembre.</li>
<li><strong>AGRHYMET, bulletin d'août 2026.</strong> Le débit du Logone à Bongor était inférieur de 21 % à celui d'août 2025, et celui du Chari à N'Djamena de 35 %.</li>
<li><strong>Notes pays du JRC ASAP.</strong> En juin, environ 70 % des cultures de l'Extrême-Nord présentaient une anomalie de végétation négative (démarrage tardif). En août, les cultures du nord étaient « proches de la moyenne ». Le Cameroun n'a pas été signalé comme point chaud (hotspot) en 2026.</li>
</ul>
<p>Au total : une saison tardive et sous la normale par endroits, avec un déficit concentré au nord, mais pas une saison ratée à l'échelle de la région. Les évaluations de récolte du ministère de l'Agriculture (MINADER) et le cycle du Cadre Harmonisé d'octobre–novembre 2026 diront quel en a été l'effet sur la production.</p>
'''

floods_html = '''
<p>Les inondations sont l'aléa qui a déclenché les grandes réponses humanitaires dans la région. En 2024, OCHA comptait début octobre 198 000 personnes touchées dans le Mayo-Danay et 156 000 dans le Logone-et-Chari, et la FICR plus de 500 000 dans toute la région. Dans la série FloodScan depuis 1998, la saison des crues 2026 est faible jusqu'ici. La part inondée du Logone-et-Chari est restée sous sa médiane presque tous les jours depuis août. Pour la région dans son ensemble, le pic au 30 septembre est le plus bas en 29 ans.</p>
<p>Ce n'est pas fini. Le 29 septembre, IMERG estimait 26 mm sur la région (31 à 35 mm dans le Diamaré, le Mayo-Danay et le Logone-et-Chari), la deuxième journée la plus pluvieuse de 2026, et la surface inondée a bondi le lendemain. Le bulletin décadaire de l'ONACC pour le 1er–10 octobre désigne les inondations comme le principal risque national. Les hautes eaux du Logone-et-Chari arrivent normalement en octobre–novembre.</p>
'''

floods_after_html = '''
<p>Les années d'inondation ne suivent pas l'ENSO ici. Sur 1998–2025, la corrélation entre le pic de surface inondée de la région et le Niño3.4 de juillet–septembre est de {r} (p = {p}, n = {n}). Les cinq plus grandes années d'inondation sont {top}. 2024, la plus importante, était neutre. Les crues du Logone dépendent des pluies sur tout son bassin, au Cameroun, au Tchad et en République centrafricaine, et des orages locaux, pas seulement du cumul de la saison sur place.</p>
<p>Une crue faible a aussi un coût. Les plaines inondables du Logone (les yaérés) portent les pâturages de saison sèche, la pêche et les cultures de décrue. Lors de la grande sécheresse de 1972–73, les débits étaient trop faibles pour inonder la plaine tchadienne (Suchel 1983). AGRHYMET signale des débits du Logone et du Chari en août 2026 nettement inférieurs à ceux de l'an dernier, et le PREGEC des niveaux plus bas dans le bassin du lac Tchad. Que cela pèse cette année dépendra d'octobre–novembre, et d'évaluations que nous n'avons pas vues.</p>
'''

heat_html = '''
<p>C'est sur la température que l'effet d'El Niño sur l'Extrême-Nord est le plus net. L'atmosphère tropicale se réchauffe pendant plusieurs mois après le pic d'un El Niño, et la saison chaude de la région (mars–mai, températures moyennes supérieures à 31 °C) tombe dans cette fenêtre. Une fois la tendance au réchauffement retirée (+0,38 °C par décennie), la température de mars–mai est corrélée au Niño3.4 de novembre–janvier précédent avec r = +0,51 (p &lt; 0,001, 46 ans, ERA5). Les températures d'ERA5 n'ont pas les défauts de ses pluies : elles assimilent des observations de surface et sont généralement fiables à cette échelle.</p>
<p>Après chacun des trois derniers El Niño forts, mars–mai s'est classé parmi les quatre plus chauds des 46 années (tendance retirée) :</p>
<ul>
<li>2009/10 : 3e plus chaud.</li>
<li>2015/16 : 4e plus chaud.</li>
<li>2023/24 : le plus chaud. Tendance incluse, mars–mai 2024 a atteint 34,5 °C en moyenne, 1,3 °C de plus que la deuxième année la plus chaude (2016).</li>
</ul>
<p>Après 1997/98, il était le 6e plus chaud. Deux des neuf épisodes du tableau ont été suivis d'une saison chaude plus fraîche que la tendance : 1992, après l'éruption du Pinatubo, et 2003.</p>
'''

heat_after_html = '''
<p>L'El Niño actuel, qui approche de son pic, est plus fort que celui de 2023/24 : un mars–mai 2027 plus chaud que la normale est donc l'issue la plus probable. Il surviendrait en fin de saison sèche, quand l'eau est la plus rare et que la soudure commence. 2026 a déjà été chaud : juillet et août ont dépassé de 1,3 à 1,5 °C leurs moyennes 1991–2020. Les prévisions saisonnières couvriront mars–mai 2027 à partir des prévisions émises en novembre–décembre.</p>
'''

food_html = '''
<p>L'insécurité alimentaire dans l'Extrême-Nord est élevée et en hausse, et son principal moteur est le conflit dans le bassin du lac Tchad, pas le climat. Le nombre de personnes en phase 3 ou pire au moment des récoltes (octobre–décembre) est passé de 0,72 million en 2021 à 0,86 million en 2025. Les analyses d'octobre/novembre ont projeté chaque soudure suivante à un niveau plus élevé : 0,90 million (2022), 0,96 million (2023), 0,99 million (2024), 1,06 million (2025) et 1,16 million (2026). Cette dernière projection, d'octobre 2025, est l'analyse la plus récente dans les données HDX/HAPI : 1,16 million de personnes (23 %) en phase 3+ pour juin–août 2026, dont 170 000 en phase 4. Nous n'avons trouvé aucune mise à jour de mars 2026.</p>
<p>La récolte 2026 n'apparaît donc encore dans aucun chiffre du Cadre Harmonisé. Le cycle d'octobre–novembre 2026 sera le premier à en tenir compte, et sa projection pour juin–août 2027 est celle qui compte ici. La série est trop courte (depuis 2020) pour montrer à elle seule un effet d'El Niño sur le Cadre Harmonisé. En 2015, le SMIAR (GIEWS) attribuait la baisse de production dans l'Extrême-Nord à des « pluies irrégulières » et à l'« insécurité civile ». En 2023, il signalait des pluies inférieures à la moyenne ayant affecté les rendements « dans des zones localisées ».</p>
'''

food_after_html = '''
<p>Ce qu'El Niño ajoute, c'est un choc sur la récolte dans les départements déjà les plus touchés. L'évaluation de FEWS NET de septembre 2026 prévoit une récolte inférieure à la moyenne et classe le Logone-et-Chari, le Mayo-Sava et le Mayo-Tsanaga en Crise. Ce sont les trois départements où la part projetée en phase 3+ est la plus élevée dans le tableau ci-dessus. Dans le Cameroun soudano-sahélien, les pluies pèsent sur les rendements surtout par la fin de saison et les séquences sèches (Nenwala et al. 2025), et le mois de septembre sec qu'indique IMERG est précisément ce type de signal.</p>
'''

next_html = '''
<p>La saison qui suit un El Niño fort n'a pas de caractère constant ici. Le tableau ci-dessous liste toutes les saisons depuis 1950 qui ont suivi un hiver où le Niño3.4 atteignait +1,0 °C ou plus. Certaines ont été très sèches : 1983, au cœur de la sécheresse sahélienne, et 1987, quand El Niño a persisté une deuxième année. D'autres ont été humides, jusqu'à 2024 : la saison la plus humide dans GPCC et la troisième dans CHIRPS et ERA5, suivie des inondations record. Ce qui comptera, c'est l'état de l'ENSO pendant la saison 2027 elle-même, ainsi que les températures de surface de l'Atlantique et de la Méditerranée, que la littérature juge tout aussi importantes.</p>
<p>Les perspectives actuelles indiquent un El Niño en déclin d'ici mi-2027 et une probabilité presque nulle de La Niña d'ici mai–juillet. L'état de juillet–septembre 2027 reste donc ouvert. Si El Niño persistait, les probabilités pencheraient de nouveau vers le sec, comme en 1987. Si le Pacifique se refroidissait, elles pencheraient vers l'humide et les inondations.</p>
'''

skill_html = '''
<p>Les prévisions SEAS5 du CEPMMT (ECMWF) pour les pluies de juillet–septembre sur l'Extrême-Nord ont une faible performance jusqu'à la prévision émise en juin. Une prévision émise en avril ou en mai, quand se prennent les décisions de semis, est un guide peu fiable. Le forum régional PRESASS (avril–mai) et les mises à jour de juin–juillet sont les premiers signaux utiles pour 2027.</p>
'''

[assessment]
one_line = "Un El Niño fort a rendu une saison des pluies sèche environ deux fois plus probable ici ; 2026 a été tardive, inégale et plus sèche au nord, mais les données divergent sur l'ampleur. Les inondations ne suivent pas El Niño. Une saison chaude 2027 plus chaude que la normale est l'effet le plus net encore à venir."

