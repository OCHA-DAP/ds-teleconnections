# Clés en anglais : ce sont les noms des produits dans l'analyse.
[product_notes]
"GPCC" = "Analyse de stations (produit combiné NOAA PSL) ; la série s'arrête en décembre 2025."
"CHIRPS v3" = "Infrarouge satellitaire combiné à des stations ; CHC, mensuel."
"CHIRPS v2" = "Version précédente de CHIRPS, toujours produite (IRI Data Library)."
"IMERG" = "Micro-ondes et infrarouge satellitaires, late run (sans ajustement aux stations) ; journalier."
"ERA5" = "Réanalyse (aucune station pluviométrique assimilée) ; voir la réserve à la section 2."
"GPCC first guess" = "Analyse de stations à partir des premiers relevés du mois (DWD)."
"GPCC monitoring" = "Produit de suivi ultérieur du GPCC, avec davantage de stations (DWD) ; jusqu'à juillet pour l'instant."

[strong_notes]
"1987" = "Un inventaire gouvernemental des sécheresses mentionne des pénuries alimentaires et d'eau dans le Logone-et-Chari, à Mora et à Maroua début 1987, avant les pluies de la saison ; nous n'avons trouvé aucun rapport sur la saison elle-même."
"1997" = "La plus sèche des quatre dans GPCC ; aucun rapport d'impact trouvé pour 1997."
"2015" = "SMIAR (GIEWS) : production réduite dans l'Extrême-Nord en raison de pluies irrégulières et de l'insécurité."
"2023" = "SMIAR (GIEWS) : pluies inférieures à la moyenne ayant affecté les rendements dans des zones localisées de l'Extrême-Nord."

