# DRC — El Niño, the Indian Ocean Dipole and floods, 2026/27. Built by drc_deep_dive.py (builder = "drc").
# Plot-led and ENCRYPTED (staticrypt): one short headline per figure, no paragraphs. English and French sit side
# by side here; {placeholders} are filled from the build (report() prints the values), so numbers cannot drift.
# The comparison with the partner's internal scenario note lives in deep_dives/private/drc-partner.toml (gitignored)
# and only ever appears inside the encrypted HTML. Nothing in this file may quote that note.
iso3 = "COD"
name = "DR Congo: floods"
builder = "drc"
restricted = true

[catalogue]
evidence = "moderate"

[assessment]
evidence = "moderate"
one_line = "Restricted page. What past seasons with a strong El Niño and a positive Indian Ocean Dipole brought in river, lake and wetland floods, region by region."

[page]
title_en = "El Niño, the Indian Ocean Dipole and floods in the DRC, 2026/27"
title_fr = "El Niño, le dipôle de l'océan Indien et les inondations en RDC, 2026/27"
sub_en = "What past seasons like this one brought, region by region. A past range, not a forecast."
sub_fr = "Ce qu'ont apporté les saisons passées comparables, région par région. Une fourchette passée, pas une prévision."
dateline_en = "Draft for the OCHA DRC office · data to {data_end}"
dateline_fr = "Version de travail pour le bureau OCHA RDC · données au {data_end}"
tiles_en = "2026/27 so far"
tiles_fr = "2026/27 à ce jour"

[[tiles]]
big = "{oni_now} °C"
en = "El Niño, {oni_months} {oni_year}: the strongest for those months since 1950"
fr = "El Niño, {oni_months} {oni_year} : le plus fort pour ces mois depuis 1950"
[[tiles]]
big = "{dmi_now} °C"
en = "Indian Ocean Dipole, 1 Oct to {dmi_end}: as in 2015/16, about half of 2019/20 and 2023/24"
fr = "Dipôle de l'océan Indien, du 1er oct. au {dmi_end} : comme en 2015/16, environ la moitié de 2019/20 et 2023/24"
[[tiles]]
big = "{now_k}k"
big_fr = "{now_k} k"
en = "people in flooded areas on the Congo and Ubangi on {now_date}, the {now_rank_en} for that date in {now_n} seasons"
fr = "personnes en zone inondée sur le Congo et l'Oubangui au {now_date}, {now_rank_fr} niveau à cette date en {now_n} saisons"
[[tiles]]
big = "{lake_oct} m"
en = "Lake Tanganyika in October, the {lake_oct_rank_en} October of {lake_n}; {lake_gap} m below the 2024 flood peak (satellite datum)"
fr = "Lac Tanganyika en octobre, {lake_oct_rank_fr} octobre sur {lake_n} ; {lake_gap} m sous le pic de crue de 2024 (référence satellite)"

[[sections]]
id = "how-many"
fig = "how_many"
en = "Three of the four El Niño + Dipole seasons are among the five largest flood seasons since 1998; {hm_others} were as large without El Niño or a positive Dipole"
fr = "Trois des quatre saisons El Niño + dipôle figurent parmi les cinq plus grandes saisons de crue depuis 1998 ; {hm_others} ont été aussi grandes sans El Niño ni dipôle positif"
note_en = "2015/16, the closest past season so far, ranks {hm_rank_1516} of {hm_n}."
note_fr = "2015/16, la saison passée la plus proche à ce jour, est {hm_rank_1516} sur {hm_n}."

[[sections]]
id = "setup"
fig = "setup"
en = "El Niño is the strongest on record for the time of year; the Dipole so far is like 2015/16, which had the lowest Dipole of the three analogue seasons in the flood record"
fr = "El Niño est le plus fort jamais mesuré pour cette période de l'année ; le dipôle ressemble à ce jour à celui de 2015/16, le plus faible parmi les trois saisons analogues de l'archive des crues"
note_en = "On the Dipole so far, 2015/16 is the closest past season; it is the dashed line in the flood timing chart."
note_fr = "Pour le dipôle, 2015/16 est à ce jour la saison passée la plus proche ; c'est la ligne en tirets du graphique du calendrier des crues."

[[sections]]
id = "forecast"
fig = "forecast"
en = "The {fc_month} forecast is drier than normal for {fc_w1} in the Congo and Ubangi provinces and wetter than normal to {fc_w2_end} in the centre and south"
fr = "La prévision de {fc_month} est plus sèche que la normale pour {fc_w1} dans les provinces du Congo et de l'Oubangui, et plus humide que la normale jusqu'en {fc_w2_end} au centre et au sud"
note_en = "In 1997 and 2023 the {fc_month} forecast for the Congo and Ubangi provinces was among the wettest, and so was the rain; in 2015 it was near normal, the rain was below normal, and the rivers still had their {rank_1516_en} flood since 1998."
note_fr = "En 1997 et 2023, la prévision de {fc_month} pour les provinces du Congo et de l'Oubangui était parmi les plus humides, et la pluie aussi ; en 2015, elle était proche de la normale, la pluie inférieure à la normale, et les fleuves ont tout de même connu {rank_1516_fr} crue depuis 1998."

[[sections]]
id = "drivers"
fig = "drivers"
en = "The extra September–December rain comes with the Dipole; El Niño's own effect is small, apart from a drier September–November around Kinshasa"
fr = "Le surplus de pluie de septembre–décembre vient avec le dipôle ; l'effet propre d'El Niño est faible, sauf un septembre–novembre plus sec autour de Kinshasa"
note_en = "CHIRPS and ERA5 agree on a wetter September–December, but not on where, and disagree on January–March."
note_fr = "CHIRPS et ERA5 s'accordent sur un septembre–décembre plus humide, mais pas sur les endroits, et divergent pour janvier–mars."

[[sections]]
id = "timing"
fig = "flood_cycle"
en = "The Congo and Ubangi peak in December; the Lualaba floodplains and the south-east in March–April"
fr = "Le Congo et l'Oubangui culminent en décembre ; les plaines du Lualaba et le Sud-Est en mars–avril"
note_en = "A low level on this date has not ruled out a large flood: on {now_day}, 2015/16 had {early_1516}k and still brought the {rank_1516_en} Congo and Ubangi flood since 1998."
note_fr = "Un niveau bas à cette date n'a pas exclu une grande crue : au {now_day}, 2015/16 n'avait que {early_1516} k et a pourtant donné {rank_1516_fr} crue du Congo et de l'Oubangui depuis 1998."

[[sections]]
id = "range"
fig = "flood_peaks"
en = "The three largest Congo and Ubangi floods since 1998 came in El Niño + Dipole seasons; elsewhere, other seasons rank as high"
fr = "Les trois plus grandes crues du Congo et de l'Oubangui depuis 1998 sont venues en saison El Niño + dipôle ; ailleurs, d'autres saisons se classent aussi haut"

[[sections]]
id = "lake"
fig = "lake"
en = "Rises like {strong_years} would take Lake Tanganyika past its 2024 peak; a 2015/16 rise would not"
fr = "Des hausses comme en {strong_years} porteraient le lac Tanganyika au-delà de son pic de 2024 ; une hausse comme en 2015/16, non"

[[sections]]
id = "southeast"
fig = "southeast"
en = "After a strong El Niño, January–March in Haut-Katanga was dry {se_dry} times out of {se_n}"
fr = "Après un El Niño fort, janvier–mars a été sec au Haut-Katanga {se_dry} fois sur {se_n}"

[[sections]]
id = "reported"
fig = "reported"
en = "The largest reported flood seasons were 2023/24 and 2019/20; the deadliest flood, Kalehe in May 2023, was a flash flood"
fr = "Les plus grandes saisons d'inondation signalées sont 2023/24 et 2019/20 ; la crue la plus meurtrière, Kalehe en mai 2023, était une crue éclair"

[[sections]]
id = "needs"
fig = "needs"
en = "Floods and needs are mostly in different places, except the Kivu flash-flood belt the satellite cannot see"
fr = "Crues et besoins sont surtout à des endroits différents, sauf dans la zone de crues éclair du Kivu, invisible au satellite"

[[sections]]
id = "hnrp-split"
fig = "need_split"
en = "On the rivers and in Kinshasa, almost all people in flooded areas are in severity-2 health zones, which hold only {sev2_pin}% of people in need"
fr = "Sur les fleuves et à Kinshasa, presque toutes les personnes en zone inondée sont dans des zones de santé de sévérité 2, qui ne comptent que {sev2_pin} % des personnes dans le besoin"

[[sections]]
id = "hnrp-list"
fig = "flood_lists"
en = "{risk_blind}% of the people on the HNRP flood-risk list are in territories where FloodScan saw fewer than {seen_below} people in flooded areas in 2023/24"
fr = "{risk_blind} % des personnes de la liste de risque d'inondation du HNRP sont dans des territoires où FloodScan a vu moins de {seen_below} personnes en zone inondée en 2023/24"

[notes]
en = [
  "<b>People in flooded areas</b> (FloodScan × WorldPop 2020): each ~1 km cell's flooded share (where 5% or more) times its population, daily since 12 January 1998, so 1997/98 is a floor. River, lake and wetland floods only: no flash floods, landslides or urban run-off. It is not people affected: in 2023/24 FloodScan had about {fs_2324}k, EM-DAT {affected_2324} M.",
  "<b>Analogue seasons</b>: strong El Niño with a positive Dipole (Sep–Nov ONI ≥ 1.5 °C, DMI ≥ 0.4 °C): 1997/98, 2015/16, 2023/24 (also 1972/73 and 1982/83, before the flood record). Very strong Dipole with a weak El Niño (DMI ≥ 1.0 °C, ONI &lt; 1.0 °C): 2019/20. Three or four seasons give a range, not odds.",
  "<b>Needs</b>: HNRP 2026 as revised in July 2026 ({pin_total} M people in need, {hz_n} health zones). Each territory's people in flooded areas are shared out like its population across its health zones, so the share in need is an estimate: it assumes they are as likely to be in need as their neighbours.",
  "<b>Other sources</b>: EM-DAT (CRED/UCLouvain, a floor, team snapshot to {emdat_end}); CHIRPS v3 and ERA5 rainfall; ECMWF SEAS5 seasonal forecasts; NASA GSFC G-REALM lake altimetry (EGM2008 datum, not the national gauge datum); NOAA CPC ONI; NOAA OSMC and Bureau of Meteorology Dipole indices.",
]
fr = [
  "<b>Personnes en zone inondée</b> (FloodScan × WorldPop 2020) : la part inondée de chaque cellule d'environ 1 km (si 5 % ou plus) multipliée par sa population, chaque jour depuis le 12 janvier 1998 ; 1997/98 est donc un minimum. Crues des fleuves, lacs et zones humides seulement : ni crues éclair, ni glissements de terrain, ni ruissellement urbain. Ce ne sont pas des personnes affectées : en 2023/24, FloodScan en comptait environ {fs_2324} k, EM-DAT {affected_2324} M.",
  "<b>Saisons analogues</b> : El Niño fort avec dipôle positif (ONI sept.–nov. ≥ 1,5 °C, DMI ≥ 0,4 °C) : 1997/98, 2015/16, 2023/24 (aussi 1972/73 et 1982/83, avant l'archive des crues). Dipôle très fort avec El Niño faible (DMI ≥ 1,0 °C, ONI &lt; 1,0 °C) : 2019/20. Trois ou quatre saisons donnent une fourchette, pas des probabilités.",
  "<b>Besoins</b> : HNRP 2026 révisé en juillet 2026 ({pin_total} M de personnes dans le besoin, {hz_n} zones de santé). Les personnes en zone inondée de chaque territoire sont réparties comme sa population entre ses zones de santé : la part dans le besoin est donc une estimation, qui les suppose autant dans le besoin que leurs voisins.",
  "<b>Autres sources</b> : EM-DAT (CRED/UCLouvain, un minimum, copie de l'équipe au {emdat_end}) ; pluie CHIRPS v3 et ERA5 ; prévisions saisonnières ECMWF SEAS5 ; altimétrie G-REALM de la NASA GSFC pour le lac (référence EGM2008, pas celle des échelles nationales) ; ONI de la NOAA CPC ; indices du dipôle de la NOAA OSMC et du Bureau of Meteorology.",
]
