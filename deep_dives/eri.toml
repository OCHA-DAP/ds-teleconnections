# Eritrea — ENSO deep dive. Narrative is curated here; figures and tables are
# recomputed by enso_deep_dive.py from the cached ERA5 grid + Niño3.4.
iso3 = "ERI"
name = "Eritrea"
subtitle = "Why the catalogue's 'robust' El Niño → drier grade deserves a closer look, and what it means for kiremti drought"
headline_season = "JAS"          # the season the drought analysis is built on
map_seasons = ["JAS", "OND", "DJF"]

summary_html = '''
<p><strong>Bottom line.</strong> The survey catalogue grades Eritrea <em>robust</em> for El Niño → drier JJAS rains. That grade was never earned by Eritrea-specific evidence: it was inherited from the regional row for the Ethiopian, Sudanese and South Sudanese highlands. The direction is right — Eritrea's kiremti rains are the northern tail of Ethiopia's kiremt system — but the Eritrea-specific literature is thin, and ERA5 shows a moderate signal (country JAS r ≈ −0.41) that is strong only along the Tigray border and fades to near nothing in the northern highlands around Anseba. The Red Sea coast responds the opposite way in its winter rains.</p>
<p><strong>For drought.</strong> The correlation understates the drought relevance because the response is asymmetric. Of the nine El Niño kiremti seasons since 1981, five landed in the driest third (1991, 2004, 2009, 2015, 2023) and four in the driest fifth; 2023 was the driest season in the whole record. But three El Niño years (1982, 1987, 1997) were near normal or wet, and eight of the fifteen driest seasons were ENSO-neutral. El Niño roughly doubles the odds of a bad kiremti; it explains about a third of them.</p>
<p><strong>Recommendation.</strong> Regrade to <em>moderate</em>, cite the Ethiopia/Eritrea-specific studies rather than a global composite, and mark the country bidirectional (JJAS drier inland, OND–DJF wetter on the coast), as Ethiopia and Yemen already are.</p>
'''

seasonal_cycle_html = '''
<p>Eritrea is a summer-rain country in the aggregate: July–September carries about 58% of the annual total over the average cell, and the June–September kiremti nearly all of it. The winter rains that matter on the coast (October–February) are only 10–16% of the national mean, which is why the survey's 25% rainy-season filter drops them at country level.</p>
'''

corr_html = '''
<p>At pixel level the summer signal is real but moderate and strongly graded from south to north. Along the Tigray border and in the south-east the correlation reaches −0.5 or below; across the central highlands it sits around −0.3; in the northern highlands around Anseba and the north-west it weakens to −0.15 to −0.25, below the survey's colour threshold. Only about one cell in eight clears the survey's “strong” bin. In the winter windows the coastal cells respond the opposite way, with OND correlations above +0.5 in every analysable cell.</p>
<p>This is why the survey's pixel map looks mixed: in the default view (pixel, unique signal, 3-month lag) Eritrea shows a patchwork of moderate brown inland, blue on the coast, and blanks where no season passes the filters.</p>
'''

adm0_html = '''
<p>Averaged to a national series the JAS signal is −0.41 (best at a one-month lead, i.e. June–August Niño3.4 against July–September rain), against −0.63 for Ethiopia and −0.59 for South Sudan. The concurrent JJA correlation misses significance and the partial correlation (other modes held constant) drops to −0.27. The strongest correlations in the table are the winter ones, and they are positive.</p>
'''

drought_html = '''
<p>Drought is where the signal earns its keep. A Pearson r describes a symmetric linear relationship; the kiremti response to ENSO is not symmetric. La Niña years are reliably wet (only two of twelve in the driest third), while El Niño years split: five of nine were in the driest third and four in the driest fifth, but 1982, 1987 and 1997 were near normal or wet — 1997, the strongest event of the period, did not produce a highland drought. Neutral years supply most droughts in absolute terms, including the severe 1990, 2017 and 2021 seasons.</p>
<p>Read as odds: an El Niño roughly doubles the chance of a driest-third kiremti (about 55% against a 33% base rate) and quadruples the chance of a driest-fifth one, but an El Niño forecast alone would have missed two thirds of the bad seasons. It is a useful readiness signal, not a trigger.</p>
'''

