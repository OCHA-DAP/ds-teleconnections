one_line = "Graded robust by inheritance from Ethiopia's kiremt row. ERA5 supports the direction at moderate strength (JAS r ≈ −0.4), strongest along the Tigray border, weak in the northern highlands, and reversed on the Red Sea coast in winter. El Niño roughly doubles the odds of a driest-third kiremti."


[[sections_before]]
title = "Why the catalogue says “robust”"
html = '''
<p>The literature map was built region by region. Eritrea sat inside the Horn of Africa block with Djibouti, Sudan and South Sudan, and the whole block took the grade of one regional finding: “Ethiopia / Sudan / S. Sudan highlands — JJAS kiremt / Blue Nile — El Niño drier — Robust”, sourced to Dai &amp; Wigley (2000). That paper is a global 2.5° empirical-orthogonal-function composite of ENSO-related precipitation; it shows the Sahel-to-Ethiopia summer drying belt but says nothing specific about Eritrea.</p>
<p>Two consequences follow. First, the per-country catalogue row for Eritrea carries a single global citation and a “gap vs NOAA/IRI” badge that both belong to the Ethiopian row. Second, the confidence shading on the map (dark brown = robust) tells a reader that the Eritrean link is as well replicated as Ethiopia's, which the evidence below does not support.</p>
'''

[[sections_before]]
title = "What the literature actually supports"
html = '''
<p><strong>The regional mechanism is solid.</strong> Ethiopia's June–September kiremt rains are among the best-documented ENSO teleconnections in Africa. Korecha &amp; Barnston (2007) find a strong negative correlation between kiremt rainfall and tropical Pacific SST and use Niño3.4 as the leading predictor; Gleixner et al. (2017) show the mechanism (warm Pacific SST → weaker Tropical Easterly Jet and East African low-level jet → subsidence over the highlands); Segele &amp; Lamb (2005) and Diro et al. (2011) replicate the sign across station networks. The Eritrean highlands and western lowlands receive their kiremti rains from the same monsoon flow, so a drying tendency under El Niño is physically expected.</p>
<p><strong>Eritrea-specific evidence is thin.</strong> The one study that treats Eritrea directly is Seleshi &amp; Demarée (1995), which relates rainfall indices for the north-central Ethiopian and Eritrean highlands over 1900–1990 to the Southern Oscillation Index and finds main-season droughts more likely in warm-ENSO years. A later Eritrean-highlands study finds Indian Ocean SST, not the Pacific, to be the strongest predictor of July–August rainfall at Asmara and Mendefera. Nicholson's (2017) review of eastern African rainfall characterises the ENSO link to the summer rains of northern Ethiopia and Eritrea as much weaker than in the rest of the region.</p>
<p><strong>The coast is a different climate.</strong> The Red Sea coastal plain and the eastern escarpment get their rain in winter (roughly October–February), from onshore flow over the Red Sea rather than the summer monsoon. The Horn's winter and short-rains season is wetter under El Niño, and ERA5 reproduces that here with correlations above +0.5, a signal the country-level survey cannot show because those months are a small share of the national total.</p>
<p><strong>Operational record.</strong> The 2015 El Niño produced a widely reported Eritrean drought: FAO GIEWS recorded kiremti rainfall below the long-term average in most of Maekel, Gash Barka, Anseba and eastern Debub, and a UN rapid assessment in Anseba and Northern Red Sea found that about 90% of the areas that normally flood for spate irrigation did not. The 2023 El Niño coincided with the driest ERA5 kiremti in the 45-year record.</p>
<p>Taken together: direction robust by regional analogy, amplitude and Eritrea-specific replication moderate. That is the definition of the catalogue's <em>moderate</em> grade.</p>
'''





[[sections_after]]
title = "Recommendation for the survey"
html = '''
<ul>
<li><strong>Regrade</strong> Eritrea's El Niño evidence from <em>robust</em> to <em>moderate</em> in <code>_LIT_EVIDENCE</code>, and replace the Dai &amp; Wigley citation on its catalogue row with Seleshi &amp; Demarée (1995) and Korecha &amp; Barnston (2007).</li>
<li><strong>Mark bidirectional</strong> (JJAS drier inland, OND–DJF wetter on the coast), as Ethiopia and Yemen already are, so the map stops implying a single national response.</li>
<li><strong>Keep the “gap vs NOAA/IRI” badge on the Ethiopian row only</strong>; it was never an Eritrea finding.</li>
<li><strong>Add the drought framing</strong> to the “This study (ERA5)” column: El Niño doubles the odds of a driest-third kiremti (2015, 2023 most recently).</li>
</ul>
'''

[[sections_after]]
title = "Caveats"
html = '''
<ul>
<li>ERA5 is a reanalysis; Eritrea is gauge-sparse, so the rainfall field leans on the model background. The spatial gradient is plausible (it follows the monsoon's northern limit) but should be checked against CHIRPS before it drives a decision.</li>
<li>Nine El Niño seasons is a small sample; the hit-rate above has wide uncertainty and one more event could move it by ten points.</li>
<li>The country boundary is Natural Earth 110m rasterised with “all touched”, so edge cells straddle Ethiopia and Sudan.</li>
<li>No field-significance correction is applied at pixel level; read coherent regions, not single cells.</li>
</ul>
'''

