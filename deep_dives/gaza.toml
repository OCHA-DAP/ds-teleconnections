[[sections_after]]
title = "Caveats"
html = '''
<ul>
<li><strong>A relationship that switched on can switch off.</strong> The El Niño link in all three long records appears only after the late 1970s. The page's numbers describe 1979–2025, not a physical law, and the coming event is likely to be stronger than any in that period.</li>
<li><strong>Small samples and index choice.</strong> 14 El Niño winters since 1979 on the pinned index (16 on HadISST), six of them strong and two of those following major eruptions. Every hit rate here carries wide uncertainty, and the break at 1979 was identified from the data and the literature together.</li>
<li><strong>No rain gauge inside Gaza reports internationally.</strong> GPCC is a 1° analysis that takes in the southern coastal plain and north-western Negev; after 2019 it is the Monitoring product, built on fewer gauges. Beer Sheva is 46 km inland, drier, and one of GPCC's inputs, so the two are not independent. ERA5 is three 25 km cells, partly over the sea, and assimilates no rain gauges. IMERG is the satellite-only late run, which tracks the gauges less well year to year. Their agreement on the sign and the timing is the evidence; no single number is Gaza's.</li>
<li><strong>Forecast calibration.</strong> The September 2026 SEAS5 issuance sits in the tails of its hindcast unusually often across the globe (see the <a href="../zwe/">Zimbabwe page</a>); a very strong El Niño can do that, but the normalisation check is not complete. Read its return periods as a ranking. The last time El Niño and a positive Indian Ocean Dipole lined up, a “forecast of opportunity” for October–December 2023 gave better than 60% odds of above-normal rain over Southwest Asia, and the season came in at the 15th percentile (Hoell et al. 2025).</li>
<li><strong>Rainfall is one of four winter hazards.</strong> Sea surge, wind and cold caused a large share of the damage and deaths in the last three winters, and none of them has an El Niño signal in this analysis or in the literature.</li>
<li><strong>Impact figures.</strong> Counts from Gaza authorities (Ministry of Health, Civil Defence, Government Media Office) are relayed, not verified, by the UN; OCHA does not systematically monitor non-conflict deaths. Reporting practice changed between winters, and several figures are cumulative or count exposure rather than impact.</li>
</ul>
'''

