# recomputed by enso_deep_dive.py from the cached ERA5 grid + Niño3.4, the seas5-skill
# skill cube and the FEWS NET mirror.
iso3 = "ZWE"
name = "Zimbabwe"
subtitle = "The textbook case: the strongest El Niño → drier signal in the survey, what it missed, and where food insecurity already sits"
headline_season = "DJF"          # the season the drought analysis is built on
map_seasons = ["OND", "NDJ", "DJF", "JFM"]   # chronological: the signal is already there in OND and peaks in DJF
zone_history = true
zone_history_caption = "Zones follow the DJF rainfall climatology, a proxy for Zimbabwe's natural regions: the wet highveld and north-east, the middleveld, and the dry lowveld and south-west."
skill_issued_month = 9
food_security = "fews"
adm0_filtered_note = "they are dry-season windows with almost no rain, listed for completeness only."

summary_html = '''
<p><strong>Bottom line.</strong> Zimbabwe is the country the southern-Africa row was written for. The catalogue's <em>robust</em>, El Niño → drier DJF grade rests on a literature that starts with Zimbabwe itself — Cane, Eshel and Buckland's 1994 <em>Nature</em> paper forecast Zimbabwean maize yield from Pacific sea-surface temperature — and ERA5 gives it the strongest national correlation in the survey: DJF r = −0.68, every grid cell past −0.3 and 86% of them past −0.5. Unlike Malawi, the signal is not confined to one region or one part of the season: it is already present in OND (r ≈ −0.5), peaks in DJF and holds through JFM, in the wet north-east and the dry south-west alike.</p>
<p><strong>For drought.</strong> Of the fourteen El Niño DJF seasons since 1981, nine fell in the driest third and six in the driest fifth; none fell in the wettest third. La Niña seasons went the other way: one of nineteen in the driest third, eleven in the wettest. The El Niño list is the country's drought calendar — 1982/83, 1986/87, 1991/92 (the driest season in the record), 1994/95, 2002/03, 2004/05, 2015/16, 2018/19 and 2023/24 — and the misses are as instructive as the hits: 1997/98, the strongest El Niño of the century, produced a near-normal season, and 1987/88, 2009/10 and 2014/15 were normal or wet.</p>
<p><strong>Recommendation.</strong> Keep <em>robust</em> and keep DJF. Add the drought framing to the catalogue row (El Niño roughly doubles the odds of a driest-third season and all but rules out a wet one), note the 1997/98 lesson — the Indian Ocean can override the Pacific — and record that Zimbabwe already has an El Niño anticipatory action plan, so the question here is calibration and timing rather than whether the signal exists.</p>
'''

seasonal_cycle_html = '''
<p>Zimbabwe has a single summer rainy season from November to March: December–February carries about 55% of the annual total and November–March about 89%. The north-east and the eastern highlands are wettest and the Limpopo lowveld in the south and south-west driest, a gradient the country's agricultural natural regions (I to V) follow. The three zone lines are the DJF climatology bands used throughout the page.</p>
'''

corr_html = '''
<p>The four panels tell a simpler story than Malawi's. In OND, before the rains have properly started, the whole country is already brown at −0.3 to −0.5, strongest in the south. In NDJ the correlation deepens to a median of −0.48, and in DJF to −0.57, with 86% of cells past −0.5 and the strongest values across the middleveld and Mashonaland; in JFM it eases to a median of −0.46 but remains past −0.3 in almost every cell, weakest in the far south. There is no part of the country and no part of the season with the opposite sign.</p>
<p>The survey's pixel map therefore shows Zimbabwe as uniformly dark brown, and its country map carries the largest negative value on the continent.</p>
'''

adm0_html = '''
<p>The country-level pass gives the same shape: correlations of about −0.5 for OND and NDJ, −0.68 for DJF, −0.54 for JFM and a fading −0.35 for FMA, all significant, with the partial correlations (other modes held constant) keeping most of the amplitude. The dry-season windows are filtered by the survey's 25% rainy-season rule and carry no information.</p>
'''

drought_html = '''
<p>Nationally, El Niño DJF seasons average −0.8 SD, nine of fourteen fall in the driest third and six in the driest fifth, against base rates of 33% and 20%; no El Niño DJF season since 1981 has been in the wettest third. La Niña seasons average +0.6 SD and only one of nineteen was in the driest third. Neutral years supply the remaining droughts: 1981/82, 1990/91, 1993/94 and 2001/02.</p>
<p>The El Niño list reads as the country's disaster history. 1991/92 is the driest DJF in the record by a wide margin and the worst drought in living memory across the region. 2015/16 is second; the rains failed from October and the state of disaster followed on 4 February 2016. 1982/83 and 1986/87 are fourth and fifth. 2023/24 sits ninth on the DJF ranking but the season collapsed late — JFM 2024 is the third-driest and FMA 2024 the driest in the record — and the state of disaster was declared on 3 April 2024 with an appeal of about two billion dollars. 2018/19 combined a weak El Niño with the second-driest OND in the record.</p>
<p>The misses matter for a trigger. 1997/98 was the strongest El Niño of the century and the season was near normal nationally: a strongly positive Indian Ocean Dipole is the usual explanation, and it is the reason Zimbabwean forecasters now weigh the Indian Ocean alongside the Pacific. 1987/88 was on the wet side of normal, and 2006/07, 2009/10 and 2014/15 were near normal. Five of fourteen outside the driest third is a good record for a single index, but it is why an ENSO-only trigger would carry a false-alarm rate of about one in three.</p>
<p>Read as odds: El Niño roughly doubles the chance of a driest-third season and makes a wet one very unlikely; La Niña all but rules out a dry one. The three zones respond alike, with the lowveld and south-west somewhat weaker (zone-mean r −0.57 against −0.67 and −0.68), so a national indicator loses little here — the opposite of the Malawi case.</p>
'''

zones_html = '''
<p>Zoning by DJF climatology, as a proxy for the natural regions, shows how uniform the response is: zone-mean correlations of −0.67 in the highveld and north-east and −0.68 in the middleveld, with El Niño hit-rates of 64% and 71%; the dry lowveld and south-west is a little less tightly coupled at −0.57 and 57%. Unganai and Mason found the south more predictable than the north at long range, so the weaker concurrent correlation there is not the whole story: its rains depend more on the late season.</p>
'''

skill_html = '''
<p>Zimbabwe is where SEAS5 has the most to offer in southern Africa, and it shows in September already. Read the panel against the climatology: the two windows that carry the season, NDJ and DJF, are two and three months ahead in September and reach <em>moderate</em> skill in every zone (median pixel r 0.41–0.50, with 74–95% of cells qualifying), a level Malawi's September issuance never reaches at any lead. The shoulders are weaker: OND is low in the highveld and middleveld and moderate only in the lowveld, and JFM is low everywhere at this lead. The strong ENSO teleconnection is what the model is carrying; in a neutral year the same lead times will have less to say. The practical reading is that a September issuance is already a usable forecast checkpoint for the core of Zimbabwe's season, with the November issuance to confirm.</p>
'''

adm1_html = '''
<p>By province the picture is as uniform as the zones suggested: concurrent DJF correlations run from −0.71 in Mashonaland East to −0.52 in Matabeleland South, and in every province at least eight of the fourteen El Niño seasons were in the province's own driest third, against fewer than one in six La Niña seasons. The north-east couples most tightly to the Pacific; the far south-west least, in line with Unganai and Mason. Set against that, FEWS NET's October 2026–January 2027 projection puts the largest Phase 3 shares in Matabeleland North and Masvingo (about three quarters of their area) and Manicaland (60%), with Matabeleland South and Mashonaland Central around 40%: the provinces where drought exposure and food insecurity overlap most are Masvingo, Matabeleland North and Manicaland.</p>
'''

food_security_html = '''
<p>FEWS NET covers Zimbabwe continuously, so the current picture can be set beside the drought exposure. After the 2025/26 harvest no unit is in Phase 3: the June 2026 current situation and the August–September projection are Phase 1 and 2 throughout, with the lowveld and south-west almost entirely Stressed. The medium-term projection for October 2026 to January 2027, the lean season and the first half of the rainy season, puts 57 of 203 units into Phase 3 (Crisis), concentrated in the south and west; the province shares are in the table above. That is the window for which the September SEAS5 issuance forecasts a dry NDJ and DJF at moderate skill. The rightmost panel repeats the El Niño hit-rate map from the drought section so the two can be read together.</p>
'''

