[[sections_before]]
title = "Why the catalogue says “robust, DJF”"
html = '''
<p>The literature map was built region by region, and Zimbabwe is the anchor of the southern-Africa block. The regional finding — austral-summer rainfall reduced under El Niño and enhanced under La Niña — is sourced to Mason &amp; Goddard's (2001) global probabilistic composite, but for Zimbabwe it is not an inheritance: the country has the longest and most specific ENSO literature in the block, and the composite merely confirms what the national studies found first. The DJF season is right for Zimbabwe, where the signal peaks mid-season; the same window is a compromise for the block's northern members.</p>
'''

[[sections_before]]
title = "What the literature actually supports"
html = '''
<p><strong>Zimbabwe is where the southern-Africa ENSO story was quantified.</strong> Cane, Eshel &amp; Buckland (1994) showed that sea-surface temperature in the eastern equatorial Pacific explained more than 60% of the variance in Zimbabwe's national maize yield, with usable lead times of up to a year, and argued the relationship was tighter for yield than for rainfall itself. Phillips, Cane &amp; Rosenzweig (1998) traced the mechanism through the seasonal rainfall pattern to simulated yields. Makarau &amp; Jury (1997) and Unganai &amp; Mason (2002) established the predictability: up to about 70% of the variance in summer rainfall is potentially predictable at long range, most of it in the second half of the season (January–March), with the south more predictable than the north. Mamombe, Kim &amp; Choi (2017) confirm ENSO as the leading driver of interannual variability in the modern record.</p>
<p><strong>The regional mechanism is the same one described for Malawi</strong> — a warm eastern Pacific weakens the Angola low and the moisture flux into the subcontinent and shifts the South Indian Convergence Zone offshore — but Zimbabwe sits at the heart of the affected region rather than at its edge, which is why the response is uniform across the country and present from the start of the season. Reason &amp; Jagadheesha (2005) reproduce the recent El Niño impacts in models; Mason &amp; Goddard (2001) place Zimbabwe among the areas with the highest probability of below-normal rainfall in El Niño summers.</p>
<p><strong>Two caveats from the literature.</strong> First, the relationship is not stationary: Richard et al. (2000) show the late-summer rainfall–ENSO correlation over tropical southern Africa was close to zero before about 1970 and significant only afterwards, so the 45-year ERA5 window sits entirely in the strong-coupling era. Second, the Indian Ocean can override the Pacific: Manatsa, Chingombe &amp; Matarira (2008) find that when a positive Indian Ocean Dipole and El Niño compete, the Dipole's influence on Zimbabwe's summer rainfall dominates, which is the accepted explanation for the near-normal 1997/98 season that followed the loudest El Niño forecast in the country's history.</p>
<p><strong>Operational record.</strong> Zimbabwe has responded to El Niño with national declarations three times in the ERA5 period. On 4 February 2016 the President declared a state of drought disaster after the failed 2015/16 rains, with the food-insecure population rising through the year to about four million. In November 2023 OCHA and partners issued an El Niño anticipatory action plan for October 2023–March 2024, one of the first in the region; the season then collapsed in February and on 3 April 2024 a state of disaster was declared, with more than 80% of the country reporting below-normal rainfall and an appeal of about two billion dollars. The 1991/92 drought, before the national forecasting system existed, remains the reference event for the region.</p>
'''

[[sections_after]]
title = "Recommendation for the survey"
html = '''
<ul>
<li><strong>Keep the grade and the season.</strong> Zimbabwe's <em>robust</em> El Niño → drier DJF is the best-supported entry in the block; if anything the row should cite Cane et al. (1994) and Unganai &amp; Mason (2002) alongside Mason &amp; Goddard, since the national literature predates the global composite.</li>
<li><strong>Add the drought framing</strong> to the “This study (ERA5)” column: nine of fourteen El Niño DJF seasons in the driest third, none in the wettest; La Niña one of nineteen in the driest third.</li>
<li><strong>Record the 1997/98 caveat</strong> and the Indian Ocean Dipole as the modifier, so a reader of the map does not take the row as a guarantee.</li>
<li><strong>Note the early signal.</strong> Unlike Malawi, the OND correlation is already about −0.5, so a September ENSO state is actionable for the whole season, and the November SEAS5 issuance is the natural forecast checkpoint.</li>
<li><strong>For trigger work</strong>, a national indicator is defensible here (the zones respond alike), but pair ENSO with the Indian Ocean Dipole or with the seasonal forecast to buy down the one-in-three false-alarm rate that an ENSO-only rule would carry.</li>
</ul>
'''

[[sections_after]]
title = "Caveats"
html = '''
<ul>
<li>ERA5 is a reanalysis; Zimbabwe's gauge network is better than most in the region but has thinned since 2000, so the recent years lean more on the model background.</li>
<li>Fourteen El Niño seasons is a modest sample; the nine-of-fourteen hit rate has wide uncertainty.</li>
<li>The zones are DJF-climatology bands, a proxy for the natural regions, not administrative boundaries.</li>
<li>FEWS NET classifies areas on its own livelihood-zone × district units and publishes no population-in-phase figures; the province shares are shares of unit area (FEWS NET's own admin-1 attribute), not people.</li>
<li>The country boundary is Natural Earth 110m rasterised with “all touched”, so edge cells straddle Zambia, Mozambique, South Africa and Botswana.</li>
<li>No field-significance correction is applied at pixel level; read coherent regions, not single cells.</li>
</ul>
'''

