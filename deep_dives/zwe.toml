[[sections_after]]
title = "Caveats"
html = '''
<ul>
<li>The September 2026 SEAS5 issuance sits in the dry tail of its hindcast far more often than a calibrated forecast should, across the whole globe, not only here; a strong El Niño can produce that, but so can a normalisation problem, and the check has not been completed. Read ceiling return periods as “beyond the record”.</li>
<li>Fourteen El Niño seasons, six of them strong, is a small sample; the hit rates carry wide uncertainty.</li>
<li>ERA5 is a reanalysis and Zimbabwe's gauge network has thinned since 2000, so recent years lean more on the model background.</li>
<li>FEWS NET classifies areas, not people, and publishes no population-in-phase figures; its analysis is IPC-compatible but independent of the IPC/CH consensus.</li>
</ul>
'''

