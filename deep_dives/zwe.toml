# Zimbabwe — ENSO deep dive, question-led: how bad is the coming season, how sure are we,
# how much of it is El Niño. Figures and tables are recomputed by enso_deep_dive.py; the
# narrative here must be reconciled against them after every rebuild.
iso3 = "ZWE"
