[[sections_after]]
title = "Data and methods"
html = '''
<p><strong>Region.</strong> Extrême-Nord as the CODAB admin-1 polygon (CM004); departments from CODAB admin-2.</p>
<p><strong>Rainfall.</strong>
<ul>
<li><strong>GPCC</strong>, 1°, NOAA PSL combined product: Full Data v2020 to 2019, then Monitoring. Area-weighted over the region. The 2026 first guess and monitoring products are from DWD, and gauge counts from Full Data v2022.</li>
<li><strong>CHIRPS v3</strong>: CHC Africa monthly files, read in windows over the region.</li>
<li><strong>CHIRPS v2</strong>: IRI Data Library.</li>
<li><strong>IMERG</strong> (late run v7) and <strong>ERA5</strong>: admin-level means from the team's database (ds-raster-stats).</li>
</ul></p>
<p><strong>Season and baselines.</strong> The rainy-season total is June–September. The ENSO relationship uses 1981–2025 (IMERG 2001–2025), detrended before taking thirds. The 2026 comparisons use one baseline for all products, 2001–2025, set by IMERG's start.</p>
<p><strong>ENSO.</strong> Niño3.4 from NOAA PSL on the ERSST v5 basis: the survey's pinned series, which ends in June 2026. El Niño is ≥ +0.5 °C and La Niña ≤ −0.5 °C, averaged over July–September. For 2026, CPC's official ONI. The forecast figures are from NOAA CPC (September 2026 discussion and relative-index outlook) and IRI (September 2026).</p>
<p><strong>Vegetation.</strong> JRC ASAP per-region dekadal indicators (zFPARc and SPI-3 on cropland), as in ds-asap-trends.</p>
<p><strong>Floods.</strong> AER FloodScan SFED, daily share of each unit flagged as flooded, 1998–2026, from the team's database. FloodScan sees larger standing water only.</p>
<p><strong>Temperature.</strong> ERA5 monthly-mean 2 m temperature (CDS), mean of the 0.25° cells touching the region.</p>
<p><strong>Food security.</strong> Cadre Harmonisé results via HDX/HAPI (the team's IPC mirror).</p>
<p><strong>Forecast skill.</strong> SEAS5 skill from the team's seas5-skill cube: ensemble mean against ERA5, 1981–2025, detrended.</p>
<p><strong>External reports</strong> (FEWS NET, PREGEC, AGRHYMET, ASAP notes, GIEWS, ONACC, NOAA, IRI) are cited as published; we have not seen MINADER or DNM data.</p>
'''

